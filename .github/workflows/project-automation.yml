name: Project automation

# Keeps Project #3 (https://github.com/users/paulchrisluke/projects/3) in sync
# with issue activity:
#
#   - issue assigned                  -> Status = Ready
#   - PR references #N                -> issue #N Status = In Progress
#   - PR references an unassigned #N  -> assign it to the PR author, then In Progress
#
# Projects v2 is not writable by the default GITHUB_TOKEN, so every gh call in
# this workflow runs under secrets.PROJECT_TOKEN.
#
# pull_request_target (not pull_request) is used so the secret is available on
# pull requests from forks. This workflow never checks out or executes pull
# request code; it only reads the title and body as text, passed through env.

on:
  issues:
    types: [assigned]
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read

concurrency:
  group: project-automation-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync issues to Project #3
    runs-on: ubuntu-latest
    steps:
      - name: Update project status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          OWNER="paulchrisluke"
          PROJECT_NUMBER=3

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::secrets.PROJECT_TOKEN is not set. Projects v2 cannot be written with GITHUB_TOKEN."
            exit 1
          fi

          project_json="$(gh project view "$PROJECT_NUMBER" --owner "$OWNER" --format json)"
          project_id="$(jq -r '.id' <<<"$project_json")"

          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json --limit 100)"
          status_field_id="$(jq -r '.fields[] | select(.name == "Status") | .id' <<<"$fields_json")"

          if [[ -z "$status_field_id" || "$status_field_id" == "null" ]]; then
            echo "::error::Project #${PROJECT_NUMBER} has no Status field."
            exit 1
          fi

          status_option_id() {
            jq -r --arg name "$1" \
              '.fields[] | select(.name == "Status") | .options[] | select(.name == $name) | .id' \
              <<<"$fields_json"
          }

          ready_id="$(status_option_id "Ready")"
          in_progress_id="$(status_option_id "In Progress")"

          for pair in "Ready:$ready_id" "In Progress:$in_progress_id"; do
            if [[ -z "${pair#*:}" || "${pair#*:}" == "null" ]]; then
              echo "::error::Status option '${pair%%:*}' not found in Project #${PROJECT_NUMBER}."
              exit 1
            fi
          done

          # Adds the issue to the project if it is not already an item (addProjectV2ItemById
          # is idempotent and returns the existing item), then sets its Status.
          set_status() {
            local issue_number="$1" option_id="$2" status_name="$3"
            local issue_url item_id

            issue_url="https://github.com/${REPO}/issues/${issue_number}"

            item_id="$(gh project item-add "$PROJECT_NUMBER" --owner "$OWNER" \
              --url "$issue_url" --format json | jq -r '.id')"

            if [[ -z "$item_id" || "$item_id" == "null" ]]; then
              echo "::error::Could not resolve a project item for issue #${issue_number}."
              exit 1
            fi

            gh project item-edit \
              --id "$item_id" \
              --project-id "$project_id" \
              --field-id "$status_field_id" \
              --single-select-option-id "$option_id"

            echo "Issue #${issue_number} -> ${status_name}."
          }

          if [[ "$EVENT_NAME" == "issues" ]]; then
            set_status "$ISSUE_NUMBER" "$ready_id" "Ready"
            exit 0
          fi

          # Any #N in the PR title or body counts as a reference, closing keywords
          # (Fixes/Closes/Resolves) included.
          refs="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | grep -Eo '(^|[^A-Za-z0-9_])#[0-9]+' \
            | grep -Eo '[0-9]+' | sort -u || true)"

          if [[ -z "$refs" ]]; then
            echo "PR #${PR_NUMBER} references no issues."
            exit 0
          fi

          while IFS= read -r issue_number; do
            [[ -z "$issue_number" ]] && continue
            [[ "$issue_number" == "$PR_NUMBER" ]] && continue

            # #N may be a pull request; those have no place on the issue board.
            if ! issue_json="$(gh issue view "$issue_number" --repo "$REPO" --json assignees 2>/dev/null)"; then
              echo "#${issue_number} is not an issue in ${REPO}; skipping."
              continue
            fi

            if [[ "$(jq '.assignees | length' <<<"$issue_json")" -eq 0 ]]; then
              if gh issue edit "$issue_number" --repo "$REPO" --add-assignee "$PR_AUTHOR"; then
                echo "Assigned issue #${issue_number} to ${PR_AUTHOR}."
              else
                echo "::warning::Could not assign ${PR_AUTHOR} to issue #${issue_number} (assignees need repository access)."
              fi
            fi

            set_status "$issue_number" "$in_progress_id" "In Progress"
          done <<< "$refs"
