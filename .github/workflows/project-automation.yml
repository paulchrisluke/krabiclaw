name: Project automation

on:
  issues:
    types: [assigned]
  pull_request:
    types: [opened, reopened, edited]

permissions:
  issues: write
  pull-requests: read

jobs:
  project-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Update Project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          OWNER="paulchrisluke"
          PROJECT_NUMBER=3

          echo "Loading Project #${PROJECT_NUMBER}..."
          project_json="$(gh project view "$PROJECT_NUMBER" --owner "$OWNER" --format json)"
          project_id="$(jq -r '.id' <<<"$project_json")"

          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json --limit 100)"
          status_field_id="$(jq -r '.fields[] | select(.name == "Status") | .id' <<<"$fields_json")"

          if [[ -z "$status_field_id" || "$status_field_id" == "null" ]]; then
            echo "Could not find the Status field in Project #${PROJECT_NUMBER}."
            exit 1
          fi

          status_option_id() {
            local name="$1"
            jq -r --arg name "$name" '.fields[] | select(.name == "Status") | .options[] | select(.name == $name) | .id' <<<"$fields_json"
          }

          ready_id="$(status_option_id "Ready")"
          in_progress_id="$(status_option_id "In Progress")"

          if [[ -z "$ready_id" || "$ready_id" == "null" || -z "$in_progress_id" || "$in_progress_id" == "null" ]]; then
            echo "Could not find Ready and/or In Progress status options."
            exit 1
          fi

          set_status() {
            local issue_number="$1"
            local option_id="$2"
            local status_name="$3"

            issue_url="https://github.com/${REPO}/issues/${issue_number}"
            items_json="$(gh project item-list "$PROJECT_NUMBER" --owner "$OWNER" --format json --limit 1000)"
            item_id="$(jq -r --arg url "$issue_url" '.items[] | select(.content.url == $url) | .id' <<<"$items_json")"

            if [[ -z "$item_id" || "$item_id" == "null" ]]; then
              echo "Issue #${issue_number} is not currently in Project #${PROJECT_NUMBER}; skipping status update."
              return 0
            fi

            gh project item-edit \
              --id "$item_id" \
              --project-id "$project_id" \
              --field-id "$status_field_id" \
              --single-select-option-id "$option_id"

            echo "Moved issue #${issue_number} to ${status_name}."
          }

          if [[ "$EVENT_NAME" == "issues" ]]; then
            set_status "$ISSUE_NUMBER" "$ready_id" "Ready"
            exit 0
          fi

          # PR opened/reopened/edited: find issue references in the PR title/body.
          # Explicit closing references (Fixes #123, Closes #123, Resolves #123) and
          # ordinary #123 references are both treated as issue associations.
          refs="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eo '(^|[^A-Za-z0-9_])#[0-9]+' | grep -Eo '[0-9]+' | sort -u || true)"

          if [[ -z "$refs" ]]; then
            echo "No issue references found in PR #${ISSUE_NUMBER}."
            exit 0
          fi

          while IFS= read -r issue_number; do
            [[ -z "$issue_number" ]] && continue

            issue_json="$(gh issue view "$issue_number" --repo "$REPO" --json assignees --jq '{assignees: [.assignees[].login]}')"
            assignee_count="$(jq '.assignees | length' <<<"$issue_json")"

            if [[ "$assignee_count" -eq 0 ]]; then
              gh issue edit "$issue_number" --repo "$REPO" --add-assignee "$PR_AUTHOR"
              echo "Assigned issue #${issue_number} to ${PR_AUTHOR}."
            fi

            set_status "$issue_number" "$in_progress_id" "In Progress"
          done <<< "$refs"
