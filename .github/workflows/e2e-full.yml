name: E2E nightly read-only release surfaces

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: Pinned deployed base URL (scheduled runs use NIGHTLY_BASE_URL)
        required: false
        type: string
      source_sha:
        description: Full source SHA attested by the deployed Worker (scheduled runs use NIGHTLY_SOURCE_SHA)
        required: false
        type: string
      worker_version_id:
        description: Immutable Worker version ID that must be serving normally (scheduled runs use NIGHTLY_WORKER_VERSION_ID)
        required: false
        type: string
      worker_name:
        description: Worker name whose deployed provenance is verified
        required: false
        default: krabiclaw
        type: string
      artifact_run_id:
        description: Successful full-lane run ID containing production-build-<source_sha>
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-nightly-read-only
  cancel-in-progress: true

# This is telemetry against the already-deployed, normally serving version. It does
# not check out or mutate shared staging, seed a database, call a provider,
# deploy a Worker, or write production data. Scheduled runs require the three
# NIGHTLY_* repository variables to be configured; dispatch runs may provide
# the same identities explicitly. A stale configured identity fails rather than
# silently testing a different serving version. The immutable build is required so
# deployed assets are compared byte-for-byte with the candidate that produced
# them rather than with an unrelated rebuild.
jobs:
  read-only-release-surfaces:
    name: Serving Saya and Blawby browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NIGHTLY_BASE_URL: ${{ inputs.base_url || vars.NIGHTLY_BASE_URL }}
      NIGHTLY_SOURCE_SHA: ${{ inputs.source_sha || vars.NIGHTLY_SOURCE_SHA }}
      NIGHTLY_WORKER_VERSION_ID: ${{ inputs.worker_version_id || vars.NIGHTLY_WORKER_VERSION_ID }}
      NIGHTLY_WORKER_NAME: ${{ inputs.worker_name || vars.NIGHTLY_WORKER_NAME || 'krabiclaw' }}
      NIGHTLY_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || vars.NIGHTLY_ARTIFACT_RUN_ID }}
      PLAYWRIGHT_PREVIEW_URL: ${{ inputs.base_url || vars.NIGHTLY_BASE_URL }}
      PLAYWRIGHT_WORKERS: "1"
      WORKER_NAME: ${{ inputs.worker_name || vars.NIGHTLY_WORKER_NAME || 'krabiclaw' }}
      DEPLOYMENT_EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || vars.NIGHTLY_SOURCE_SHA }}
      DEPLOYMENT_EXPECTED_WORKER_VERSION: ${{ inputs.worker_version_id || vars.NIGHTLY_WORKER_VERSION_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_sha || vars.NIGHTLY_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Download and attest the immutable candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$NIGHTLY_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$NIGHTLY_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$NIGHTLY_ARTIFACT_RUN_ID" --json conclusion,event,headSha,workflowName > "$RUNNER_TEMP/nightly-build-run.json"
          jq -e --arg sha "$NIGHTLY_SOURCE_SHA" '.conclusion == "success" and .event == "workflow_dispatch" and .headSha == $sha and .workflowName == "CI (Full Validation Lane)"' "$RUNNER_TEMP/nightly-build-run.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/nightly-build"
          gh run download "$NIGHTLY_ARTIFACT_RUN_ID" \
            --name "production-build-$NIGHTLY_SOURCE_SHA" \
            --dir "$RUNNER_TEMP/nightly-build"
          BUILD_ENTRY="$(find "$RUNNER_TEMP/nightly-build" -type f -path '*/server/index.mjs' -print -quit)"
          test -n "$BUILD_ENTRY"
          BUILD_ROOT="${BUILD_ENTRY%/server/index.mjs}"
          test ! -e .output
          cp -R "$BUILD_ROOT" .output
      - run: npx playwright install --with-deps chromium
      - name: Verify the configured Worker is serving unoverridden (read-only)
        run: |
          set -euo pipefail
          test -n "$NIGHTLY_BASE_URL"
          test -n "$NIGHTLY_SOURCE_SHA"
          test -n "$NIGHTLY_WORKER_VERSION_ID"
          node scripts/release-route-inventory.mjs \
            --base-url "$NIGHTLY_BASE_URL" \
            --output "$RUNNER_TEMP/nightly-route-inventory.json" >/dev/null
          echo "RELEASE_ROUTE_INVENTORY_PATH=$RUNNER_TEMP/nightly-route-inventory.json" >> "$GITHUB_ENV"
          node scripts/wait-for-deployed-assets.mjs
          node scripts/verify-deployed-candidate.mjs \
            --base-url "$NIGHTLY_BASE_URL" \
            --expected-sha "$NIGHTLY_SOURCE_SHA" \
            --expected-version-id "$NIGHTLY_WORKER_VERSION_ID" \
            --worker-name "$NIGHTLY_WORKER_NAME" \
            --route-inventory "$RUNNER_TEMP/nightly-route-inventory.json" \
            --output "$RUNNER_TEMP/nightly-deployment-verification.json"
      - name: Run the deployed tenant navigation journey
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/public-rendering-sentinel.spec.ts \
            --project=chromium \
            --workers=1
      - name: Re-prove the configured Worker after browser coverage (read-only)
        run: |
          set -euo pipefail
          node scripts/wait-for-deployed-assets.mjs
          node scripts/verify-deployed-candidate.mjs \
            --base-url "$NIGHTLY_BASE_URL" \
            --expected-sha "$NIGHTLY_SOURCE_SHA" \
            --expected-version-id "$NIGHTLY_WORKER_VERSION_ID" \
            --worker-name "$NIGHTLY_WORKER_NAME" \
            --route-inventory "$RUNNER_TEMP/nightly-route-inventory.json" \
            --output "$RUNNER_TEMP/nightly-post-browser-deployment-verification.json"
      - name: Write nightly evidence summary
        if: always()
        run: |
          {
            echo "## Read-only nightly release-surface verification"
            echo "- Source SHA: \`$NIGHTLY_SOURCE_SHA\`"
            echo "- Worker: \`$NIGHTLY_WORKER_NAME/$NIGHTLY_WORKER_VERSION_ID\`"
            echo "- Immutable build run: \`$NIGHTLY_ARTIFACT_RUN_ID\`"
            echo "- Base URL: $NIGHTLY_BASE_URL"
            echo "- Verification and browsers used normal unoverridden traffic; stale identity fails closed."
            echo "- No staging or production writes were performed."
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload nightly diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-nightly
          path: |
            ${{ runner.temp }}/nightly-deployment-verification.json
            ${{ runner.temp }}/nightly-post-browser-deployment-verification.json
            ${{ runner.temp }}/nightly-route-inventory.json
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
