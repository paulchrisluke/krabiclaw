      - name: Upload production release evidence
        id: upload-production-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-candidate/production-release-manifest.json
            ${{ runner.temp }}/production-candidate/**
            .output
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Restore exact production baseline after evidence upload failure
        if: always() && steps.upload-production-evidence.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_BASE_URL: https://krabiclaw.com
        run: |
          set -Eeuo pipefail

          work_dir="$RUNNER_TEMP/production-candidate"
          manifest="$work_dir/production-release-manifest.json"
          recovery="$work_dir/production-upload-failure-recovery.json"
          restore_status="$work_dir/upload-failure-restored-baseline.json"
          restore_cache="$work_dir/upload-failure-restored-cache.log"
          uuid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

          write_recovery() {
            local status="$1"
            local reason="$2"
            local restored="$3"
            local cache_purged="$4"
            RECOVERY_PATH="$recovery" RECOVERY_STATUS="$status" RECOVERY_REASON="$reason" RECOVERY_RESTORED="$restored" RECOVERY_CACHE_PURGED="$cache_purged" BASELINE_VERSION_ID="${baseline_version:-}" CANDIDATE_VERSION_ID="${candidate_version:-}" node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs'
          import { dirname } from 'node:path'
          mkdirSync(dirname(process.env.RECOVERY_PATH), { recursive: true })
          writeFileSync(process.env.RECOVERY_PATH, `${JSON.stringify({
            schemaVersion: 1,
            kind: 'production-evidence-upload-failure-recovery',
            status: process.env.RECOVERY_STATUS,
            reason: process.env.RECOVERY_REASON,
            restored: process.env.RECOVERY_RESTORED === 'true',
            cachePurged: process.env.RECOVERY_CACHE_PURGED === 'true',
            baselineVersionId: process.env.BASELINE_VERSION_ID || null,
            candidateVersionId: process.env.CANDIDATE_VERSION_ID || null,
          }, null, 2)}\n`)
          NODE
          }

          test "$PRODUCTION_BASE_URL" = "https://krabiclaw.com"
          if [[ ! -s "$manifest" ]]; then
            echo "Production evidence upload failed and no local release manifest exists; traffic state cannot be changed safely" >&2
            baseline_version=""
            candidate_version=""
            write_recovery "intervention_required" "Release manifest is missing after evidence upload failure; production traffic state cannot be proven safely." "false" "false" || true
            exit 1
          fi
          if ! jq -e 'type == "object" and (.trafficMutationAttempted | type == "boolean") and (.restoredBaseline | type == "boolean")' "$manifest" >/dev/null; then
            echo "Production release manifest is malformed after evidence upload failure; traffic state cannot be changed safely" >&2
            baseline_version=""
            candidate_version=""
            write_recovery "intervention_required" "Release manifest is malformed after evidence upload failure; production traffic state cannot be proven safely." "false" "false" || true
            exit 1
          fi

          traffic_mutation_attempted="$(jq -r '.trafficMutationAttempted' "$manifest")"
          baseline_version="$(jq -r '.baseline.versionId // empty' "$manifest")"
          candidate_version="$(jq -r '.candidate.versionId // empty' "$manifest")"
          restored_baseline="$(jq -r '.restoredBaseline' "$manifest")"
          restore_manifest_status="$(jq -r '.restore.status // empty' "$manifest")"

          if [[ "$traffic_mutation_attempted" != "true" ]]; then
            echo "Production evidence upload failed before any Worker traffic mutation; no compensating deployment will be created"
            write_recovery "not_attempted" "Evidence upload failed, but the manifest proves no production Worker traffic mutation was attempted." "false" "false"
            exit 1
          fi
          if [[ "$restored_baseline" == "true" && "$restore_manifest_status" == "verified" ]]; then
            echo "Production evidence upload failed after the exact baseline had already been restored"
            write_recovery "already_restored" "Evidence upload failed, but the manifest proves the exact production baseline was already restored and verified." "true" "true"
            exit 1
          fi
          if [[ -z "$baseline_version" || ! "$baseline_version" =~ $uuid_pattern ]]; then
            echo "Production evidence upload failed without a valid manifest-declared baseline version; operator intervention is required" >&2
            write_recovery "intervention_required" "Manifest-declared baseline version is missing or invalid after evidence upload failure." "false" "false" || true
            exit 1
          fi
          if [[ -n "$candidate_version" && ! "$candidate_version" =~ $uuid_pattern ]]; then
            echo "Production evidence upload failed with an invalid manifest-declared candidate version; operator intervention is required" >&2
            write_recovery "intervention_required" "Manifest-declared candidate version is invalid after evidence upload failure." "false" "false" || true
            exit 1
          fi

          write_recovery "restoring" "Production evidence upload failed after traffic mutation; restoring only the manifest-declared baseline." "false" "false"
          if ! npx wrangler versions deploy "$baseline_version@100" --message "Restore production baseline after release evidence upload failure" --yes; then
            echo "Exact production baseline restoration failed; operator intervention is required" >&2
            write_recovery "intervention_required" "Exact production baseline deployment failed after evidence upload failure." "false" "false" || true
            exit 1
          fi
          if ! npx wrangler deployments status --name "$WORKER_NAME" --json > "$restore_status"; then
            echo "Exact production baseline status capture failed; operator intervention is required" >&2
            write_recovery "intervention_required" "Exact production baseline status capture failed after evidence upload failure." "false" "false" || true
            exit 1
          fi
          if ! EXPECTED_BASELINE_VERSION="$baseline_version" EXPECTED_CANDIDATE_VERSION="$candidate_version" STATUS_PATH="$restore_status" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const value = JSON.parse(readFileSync(process.env.STATUS_PATH, 'utf8'))
          const deployment = value?.latest_deployment ?? value
          const versions = Array.isArray(deployment?.versions) ? deployment.versions : []
          const idOf = version => version?.version_id ?? version?.versionId ?? version?.id
          const trafficOf = version => Number(version?.percentage ?? version?.traffic ?? NaN)
          const rows = versions.map(version => ({ id: idOf(version), traffic: trafficOf(version) }))
          const active = rows.filter(row => row.traffic > 0)
          const total = rows.reduce((sum, row) => sum + row.traffic, 0)
          const baseline = rows.find(row => row.id === process.env.EXPECTED_BASELINE_VERSION)
          const candidate = process.env.EXPECTED_CANDIDATE_VERSION ? rows.find(row => row.id === process.env.EXPECTED_CANDIDATE_VERSION) : null
          if (!rows.length || rows.some(row => typeof row.id !== 'string' || !Number.isFinite(row.traffic) || row.traffic < 0 || row.traffic > 100)) throw new Error('production traffic contains an unknown version or invalid percentage')
          if (Math.abs(total - 100) > 0.001) throw new Error('production traffic does not total 100%')
          if (active.length !== 1 || active[0].id !== process.env.EXPECTED_BASELINE_VERSION || active[0].traffic !== 100) throw new Error('production traffic does not prove the exact baseline at 100%')
          if (!baseline || baseline.traffic !== 100) throw new Error('manifest-declared baseline version is absent from production traffic')
          if (candidate && candidate.traffic !== 0) throw new Error('candidate version remains active after production baseline restoration')
          NODE
          then
            echo "Exact production baseline traffic verification failed; operator intervention is required" >&2
            write_recovery "intervention_required" "Production traffic remained ambiguous after exact baseline restoration." "false" "false" || true
            exit 1
          fi
          if ! DEPLOYMENT_CACHE_ORIGIN="$PRODUCTION_BASE_URL" node --experimental-strip-types scripts/purge-deployment-cache.ts > "$restore_cache"; then
            echo "Exact production baseline cache purge failed; operator intervention is required" >&2
            write_recovery "intervention_required" "Production baseline traffic was restored, but cache purge failed after evidence upload failure." "false" "false" || true
            exit 1
          fi
          write_recovery "restored" "Evidence upload failed after mutation; exact manifest-declared production baseline was restored, verified at 100%, candidate is 0% or absent, and cache was purged." "true" "true"
          echo "Production evidence upload failed; the exact baseline was restored, but the release remains failed because durable evidence upload did not succeed." >&2
          exit 1
      - name: Prepare durable production recovery evidence
        if: always()
        run: |
          set -Eeuo pipefail
          work_dir="$RUNNER_TEMP/production-candidate"
          recovery="$work_dir/production-upload-failure-recovery.json"
          manifest="$work_dir/production-release-manifest.json"
          marker="$work_dir/database-mutation-attempted"
          if [[ ! -s "$recovery" ]]; then
            manifest_status="not_required"
            traffic_mutation_attempted="false"
            database_mutation_attempted="$( [[ -s "$marker" ]] && printf true || printf false )"
            if [[ -s "$manifest" ]]; then
              manifest_status="$(jq -r '.restore.status // "not_required"' "$manifest")"
              traffic_mutation_attempted="$(jq -r '.trafficMutationAttempted // false' "$manifest")"
              database_mutation_attempted="$(jq -r '.database.mutationAttempted // false' "$manifest")"
            fi
            RECOVERY_PATH="$recovery" RECOVERY_STATUS="$manifest_status" TRAFFIC_MUTATION_ATTEMPTED="$traffic_mutation_attempted" DATABASE_MUTATION_ATTEMPTED="$database_mutation_attempted" node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs'
          import { dirname } from 'node:path'
          mkdirSync(dirname(process.env.RECOVERY_PATH), { recursive: true })
          writeFileSync(process.env.RECOVERY_PATH, `${JSON.stringify({ schemaVersion: 1, kind: 'production-recovery-evidence', status: process.env.RECOVERY_STATUS, trafficMutationAttempted: process.env.TRAFFIC_MUTATION_ATTEMPTED === 'true', databaseMutationAttempted: process.env.DATABASE_MUTATION_ATTEMPTED === 'true' }, null, 2)}\n`)
          NODE
          fi
          test -s "$recovery"
      - name: Upload separate production recovery evidence
        id: upload-production-recovery-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-recovery-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/production-candidate/production-upload-failure-recovery.json
          retention-days: 90
          if-no-files-found: error
      - name: Report production recovery evidence transport
        if: always()
        run: |
          if [[ "${{ steps.upload-production-recovery-evidence.outcome }}" != "success" ]]; then
            echo "Production recovery evidence upload also failed; operator intervention is required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production recovery evidence upload: succeeded." >> "$GITHUB_STEP_SUMMARY"
          fi
