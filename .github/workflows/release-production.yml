name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Build and deploy main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_PREVIEW_URL: https://krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
      WORKER_NAME: krabiclaw
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Build exact main revision
        run: yarn build
      - name: Check migration data safety
        run: yarn migrate:check
      - name: Apply pending production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy exact main revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/production-deploy.log"
          npx wrangler deploy --tag "$GITHUB_SHA" --message "Deploy main $GITHUB_SHA" --old-asset-ttl 600 --strict | tee "$deploy_log"
          version_id="$(sed -nE 's/.*Current Version ID: ([0-9a-f-]{36}).*/\1/p' "$deploy_log" | tail -1)"
          test -n "$version_id"
          echo "PRODUCTION_VERSION_ID=$version_id" >> "$GITHUB_ENV"
      - name: Purge cache and verify deployed main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export DEPLOYMENT_EXPECTED_SOURCE_SHA="$GITHUB_SHA"
          export DEPLOYMENT_EXPECTED_WORKER_VERSION="$PRODUCTION_VERSION_ID"
          DEPLOYMENT_CACHE_ORIGIN=https://krabiclaw.com node --experimental-strip-types scripts/purge-deployment-cache.ts
          node scripts/wait-for-deployed-assets.mjs
          node scripts/verify-deployed-candidate.mjs \
            --base-url https://krabiclaw.com \
            --expected-sha "$GITHUB_SHA" \
            --expected-version-id "$PRODUCTION_VERSION_ID" \
            --worker-name krabiclaw \
            --output "$RUNNER_TEMP/production-deployment-verification.json"
      - name: Open deployed tenant navigation
        run: npx playwright test tests/e2e/public-rendering-sentinel.spec.ts --project=chromium --workers=1
      - name: Refresh production search index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
        run: yarn ai-search:sync:prod
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-deploy-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-deploy.log
            ${{ runner.temp }}/production-deployment-verification.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
