name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: deploy
        type: choice
        options: [deploy, recover-location-data]
      confirm:
        description: Type RESTORE_PRODUCTION_LOCATION_DATA for recovery
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Build and deploy main
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER_NAME: krabiclaw
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build exact main revision
        run: yarn build
      # Production migrations are intentionally paused while the location-parent
      # rebuild recovery is completed. Main Worker deployment remains automatic.
      - name: Deploy exact main revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/production-deploy.log"
          npx wrangler deploy --tag "$GITHUB_SHA" --message "Deploy main $GITHUB_SHA" --old-asset-ttl 600 --strict | tee "$deploy_log"
          version_id="$(sed -nE 's/.*Current Version ID: ([0-9a-f-]{36}).*/\1/p' "$deploy_log" | tail -1)"
          test -n "$version_id"
          echo "PRODUCTION_VERSION_ID=$version_id" >> "$GITHUB_ENV"
      - name: Purge cache and verify deployed main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export DEPLOYMENT_EXPECTED_SOURCE_SHA="$GITHUB_SHA"
          export DEPLOYMENT_EXPECTED_WORKER_VERSION="$PRODUCTION_VERSION_ID"
          DEPLOYMENT_CACHE_ORIGIN=https://krabiclaw.com node --experimental-strip-types scripts/purge-deployment-cache.ts
          PLAYWRIGHT_PREVIEW_URL=https://krabiclaw.com node scripts/wait-for-deployed-assets.mjs
          node scripts/verify-deployed-candidate.mjs \
            --base-url https://krabiclaw.com \
            --expected-sha "$GITHUB_SHA" \
            --expected-version-id "$PRODUCTION_VERSION_ID" \
            --worker-name krabiclaw \
            --output "$RUNNER_TEMP/production-deployment-verification.json"
      - name: Refresh production search index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
        run: yarn ai-search:sync:prod
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-deploy-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-deploy.log
            ${{ runner.temp }}/production-deployment-verification.json
          if-no-files-found: ignore
          retention-days: 14

  recover-location-data:
    name: Restore production data before migration 0111
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'recover-location-data'
    runs-on: ubuntu-latest
    steps:
      - name: Require exact recovery confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = RESTORE_PRODUCTION_LOCATION_DATA
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Restore and verify production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESTORE_TIMESTAMP: "2026-08-10T10:46:15.000Z"
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel restore DB --timestamp "$RESTORE_TIMESTAMP" --json
          counts="$RUNNER_TEMP/restored-counts.json"
          npx wrangler d1 execute DB --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM experiences WHERE site_id = 'site-kikuzuki') AS kikuzuki_experiences,
              (SELECT COUNT(*) FROM menus WHERE site_id = 'site-kikuzuki') AS kikuzuki_menus,
              (SELECT COUNT(*) FROM reviews WHERE site_id = 'site-kikuzuki') AS kikuzuki_reviews,
              (SELECT COUNT(*) FROM location_qa WHERE site_id = 'site-kikuzuki') AS kikuzuki_qa,
              (SELECT COUNT(*) FROM experiences WHERE site_id = 'site-pottery-house') AS pottery_experiences,
              (SELECT COUNT(*) FROM reviews WHERE site_id = 'site-pottery-house') AS pottery_reviews,
              (SELECT COUNT(*) FROM location_qa WHERE site_id = 'site-pottery-house') AS pottery_qa,
              (SELECT COUNT(*) FROM d1_migrations WHERE name = '0111_sharp_switch.sql') AS destructive_migration_applied;
          " > "$counts"
          node - "$counts" <<'NODE'
          const fs = require('node:fs')
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const result = rows?.[0]?.results?.[0]
          if (!result) throw new Error('Restored production count evidence is missing')
          for (const key of [
            'kikuzuki_experiences', 'kikuzuki_menus', 'kikuzuki_reviews', 'kikuzuki_qa',
            'pottery_experiences', 'pottery_reviews', 'pottery_qa',
          ]) {
            if (Number(result[key]) < 1) throw new Error(`Restored ${key} is empty`)
          }
          if (Number(result.destructive_migration_applied) !== 0) {
            throw new Error('Destructive migration 0111 is still recorded after recovery')
          }
          console.log(JSON.stringify(result))
          NODE
      - name: Purge stale public resource and HTML caches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for prefix in 'public~' 'html:'; do
            keys="$RUNNER_TEMP/kv-$(printf '%s' "$prefix" | tr -cd '[:alnum:]').json"
            npx wrangler kv key list --binding SITE_CACHE --remote --prefix "$prefix" > "$keys"
            if test "$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).length)' "$keys")" -gt 0; then
              npx wrangler kv bulk delete "$keys" --binding SITE_CACHE --remote --force
            fi
          done
      - name: Verify restored public experiences and featured rows
        run: |
          set -euo pipefail
          verify_site() {
            base_url="$1" site_id="$2" expected_title="$3" expect_menu="$4"
            payload="$RUNNER_TEMP/${site_id}.json"
            curl -fsS --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 \
              "$base_url/api/public/sites/$site_id/page?page=home&datasets=content%2Cexperiences%2Clocation%2Cmenu" \
              -H 'cache-control: no-store' > "$payload"
            node - "$payload" "$expected_title" "$expect_menu" <<'NODE'
          const fs = require('node:fs')
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const expected = process.argv[3]
          if (!payload.experiencesList?.some(item => item.title === expected)) {
            throw new Error(`Public payload is missing restored experience: ${expected}`)
          }
          if (process.argv[4] === 'true' && !payload.menu) throw new Error('Public payload is missing restored menu')
          NODE
            curl -fsS --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$base_url/" | grep -F "$expected_title" >/dev/null
            curl -fsS --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$base_url/experiences" | grep -F "$expected_title" >/dev/null
          }
          verify_site 'https://www.kikuzuki-thailand.com' 'site-kikuzuki' 'Teppanyaki Experience' 'true'
          verify_site 'https://pottery-house.krabiclaw.com' 'site-pottery-house' 'Pottery Wheel Class' 'false'
