name: CI

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Checks
    if: >-
      github.event_name == 'push'
      || !(github.base_ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'workers/email-inbound/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Hardened immutable installs
        env:
          YARN_ENABLE_HARDENED_MODE: "1"
        run: |
          corepack yarn install --immutable
          corepack yarn --cwd workers/email-inbound install --immutable
      - name: Check inbound email Worker
        run: |
          corepack yarn --cwd workers/email-inbound tsc --noEmit
          corepack yarn --cwd workers/email-inbound wrangler deploy --dry-run
      - run: yarn quality
      - run: yarn test:unit
      - run: yarn test:d1
      - run: yarn mcp:catalog
      - run: yarn chatgpt:submission:check
      - run: yarn lint:seeds
      - run: yarn lint:migrations
      - run: yarn lint:schema-drift
      - run: yarn test:migrations

  e2e-plan:
    name: Plan affected browser coverage
    if: >-
      github.event_name == 'pull_request'
      && !(github.base_ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    outputs:
      run_preview: ${{ steps.plan.outputs.run_preview }}
      scope: ${{ steps.plan.outputs.scope }}
      groups: ${{ steps.plan.outputs.groups }}
      specs: ${{ steps.plan.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select coverage from changed files
        id: plan
        env:
          E2E_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          E2E_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/select-preview-e2e.mjs --github-output "$GITHUB_OUTPUT"

  preview-build:
    name: Build preview Worker
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !(github.base_ref == 'main' && github.head_ref == 'staging')
      && needs.e2e-plan.outputs.run_preview == 'true'
    needs: e2e-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://preview.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://preview.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://preview.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://preview.krabiclaw.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'workers/email-inbound/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: yarn build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-worker-${{ github.event.pull_request.head.sha }}
          path: .output
          include-hidden-files: true
          retention-days: 2

  e2e-representative:
    name: E2E representative tests (preview only)
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !(github.base_ref == 'main' && github.head_ref == 'staging')
      && needs.e2e-plan.outputs.run_preview == 'true'
    needs: [typecheck, e2e-plan, preview-build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: shared-preview-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://preview.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://preview.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://preview.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://preview.krabiclaw.com
      E2E_ALLOW_DEV_ROUTES: "true"
      E2E_DEV_ROUTE_SECRET: ${{ secrets.E2E_DEV_ROUTE_SECRET_PREVIEW }}
      MCP_CREDENTIAL_LOGIN: "1"
      MCP_CIMD_CLIENT_URL: https://preview.krabiclaw.com/api/auth/oauth2/test-client-metadata
      MCP_PRIVATE_CIMD_CLIENT_URL: https://preview.krabiclaw.com/api/auth/oauth2/test-private-client-metadata
      PLAYWRIGHT_PREVIEW_URL: https://preview.krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
      E2E_SELECTION_SCOPE: ${{ needs.e2e-plan.outputs.scope }}
      E2E_SELECTED_SPECS: ${{ needs.e2e-plan.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'workers/email-inbound/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: preview-worker-${{ github.event.pull_request.head.sha }}
          path: .output
      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          auth_secret="$(openssl rand -base64 32)"
          password="$(openssl rand -hex 32)Aa1!"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$password"
          {
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "E2E_TEST_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Check pre-provisioned preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          corepack yarn wrangler secret list --env preview --format json > "$RUNNER_TEMP/preview-secrets.json"
          for secret_name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PREVIEW_SECRET E2E_DEV_ROUTE_SECRET EMAIL_REPLY_SECRET EMAIL_INBOUND_SECRET; do
            jq -e --arg name "$secret_name" '.. | objects | select((.name? // .key?) == $name)' "$RUNNER_TEMP/preview-secrets.json" >/dev/null
          done
      - name: Generate preview fixtures
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/generate-demo-bundle.ts
          node --experimental-strip-types scripts/generate-demo-seed.ts --preview --stdout > /tmp/preview-demo-seed.sql
          node --experimental-strip-types scripts/generate-pottery-house-seed.ts --preview --stdout > /tmp/preview-pottery-seed.sql
          node --experimental-strip-types scripts/generate-kikuzuki-seed.ts --preview --stdout > /tmp/preview-kikuzuki-seed.sql
          node --experimental-strip-types scripts/generate-ncls-seed.ts --stdout > /tmp/preview-ncls-seed.sql
      - name: Reset and migrate preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn db:reset:preview --apply --confirm-configured-preview
      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --env preview --strict
      - name: Seed preview fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/execute-preview-d1-sql.ts \
            /tmp/preview-demo-seed.sql \
            /tmp/preview-pottery-seed.sql \
            /tmp/preview-kikuzuki-seed.sql \
            /tmp/preview-ncls-seed.sql
      - name: Provision preview Better Auth fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/provision-development-auth.ts --preview
      - name: Verify preview fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn fixtures:verify:preview
      - name: Run tenant public and affected preview coverage
        run: yarn test:e2e:preview:selected
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-staging:
    name: Deploy and test staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://staging.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw Staging
      NUXT_PUBLIC_SITE_URL: https://staging.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://staging.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://staging.krabiclaw.com
      MCP_BASE_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'workers/email-inbound/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install --with-deps chromium
      - name: Build staging Worker
        run: yarn build
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --env staging --strict
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler d1 migrations apply DB --env staging --remote
      - name: Refresh staging AI Search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
          SEARCH_BASE_SHA: ${{ github.event.before }}
          SEARCH_HEAD_SHA: ${{ github.sha }}
        run: yarn ai-search:sync:staging --changed-since "$SEARCH_BASE_SHA" --changed-until "$SEARCH_HEAD_SHA"
      - name: Verify staging AI Search
        run: curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 "https://staging.krabiclaw.com/api/public/search?q=booking&type=all&surface=public"
      - name: Run read-only tenant MCP discovery smoke
        run: yarn test:mcp
      - name: Run read-only tenant rendering
        run: yarn test:e2e:tenant-rendering
      - name: Upload staging Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-staging
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    outputs:
      nuxt_build_id: ${{ steps.nuxt_build.outputs.id }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://krabiclaw.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'workers/email-inbound/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - name: Build production Worker
        run: yarn build
      - name: Capture Nuxt build ID
        id: nuxt_build
        run: |
          build_id="$(node -p 'JSON.parse(require("node:fs").readFileSync(".output/public/_nuxt/builds/latest.json", "utf8")).id')"
          printf 'id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --strict
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler d1 migrations apply DB --remote
      - name: Refresh production search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
          SEARCH_BASE_SHA: ${{ github.event.before }}
          SEARCH_HEAD_SHA: ${{ github.sha }}
        run: yarn ai-search:sync:prod --changed-since "$SEARCH_BASE_SHA" --changed-until "$SEARCH_HEAD_SHA"

  verify-production:
    name: Verify production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
      EXPECTED_NUXT_BUILD_ID: ${{ needs.deploy-production.outputs.nuxt_build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'workers/email-inbound/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install --with-deps chromium
      - name: Wait for production assets to converge
        run: >-
          node scripts/wait-for-nuxt-deployment.mjs
          https://www.potteryhousekrabi.com
          https://www.kikuzuki-thailand.com
          https://www.northcarolinalegalservices.org
      - name: Run read-only production tenant rendering
        run: yarn test:e2e:tenant-rendering
      - name: Upload production Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
