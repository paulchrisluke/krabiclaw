name: CI

# Drafts run the static Checks; the preview qualification starts at
# ready_for_review.

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Checks
    # Drafts run Checks; only the preview qualification below waits for ready.
    if: >-
      github.event_name == 'push'
      || !(github.base_ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Hardened immutable installs
        env:
          YARN_ENABLE_HARDENED_MODE: "1"
        run: corepack yarn install --immutable
      - run: yarn quality
      - run: yarn test:unit
      - run: yarn test:d1
      - run: yarn mcp:catalog
      - run: yarn chatgpt:submission:check
      - run: yarn lint:migrations
      - run: yarn lint:schema-drift
      - run: yarn test:migrations

  preview-build:
    name: Build preview Worker
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository
        && !(github.base_ref == 'main' && github.head_ref == 'staging'))
      || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://preview.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://preview.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://preview.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://preview.krabiclaw.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: yarn build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-worker-${{ github.sha }}
          path: .output
          include-hidden-files: true
          retention-days: 2

  e2e-preview-smoke:
    name: Preview smoke
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository
        && !(github.base_ref == 'main' && github.head_ref == 'staging'))
      || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    needs: [typecheck, preview-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://preview.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://preview.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://preview.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://preview.krabiclaw.com
      E2E_ALLOW_DEV_ROUTES: "true"
      E2E_DEV_ROUTE_SECRET: ${{ secrets.E2E_DEV_ROUTE_SECRET_PREVIEW }}
      MCP_CREDENTIAL_LOGIN: "1"
      MCP_CIMD_CLIENT_URL: https://preview.krabiclaw.com/api/auth/oauth2/test-client-metadata
      MCP_PRIVATE_CIMD_CLIENT_URL: https://preview.krabiclaw.com/api/auth/oauth2/test-private-client-metadata
      PLAYWRIGHT_PREVIEW_URL: https://preview.krabiclaw.com
      PLAYWRIGHT_WORKERS: "2"
    steps:
      # preview.krabiclaw.com is one deployment over one database, and this job
      # resets that database before it tests, so preview jobs serialize across
      # workflow runs. The queue orders on when each job started, never on run
      # id: a re-run keeps its original run id. A job that has not started yet
      # is not waited on; when it starts it sees this one and waits here. Equal
      # start times, which the API reports at second resolution, fall back to
      # run id. Actions API results are paginated, so every read paginates.
      - name: Wait for the shared preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_NAME: Preview smoke
          # Each holder occupies preview for roughly six minutes. This covers a
          # deep queue and still leaves room inside the job's timeout-minutes
          # for the work itself, so the deadline below is reachable rather than
          # being pre-empted by the runner.
          QUEUE_DEADLINE_MINUTES: "45"
        run: |
          set -euo pipefail
          # jq runs per page under --paginate, so each read takes its first line.
          mine=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq "[.jobs[] | select(.name == \"${JOB_NAME}\")] | .[0].started_at // empty" | head -n 1)
          if [ -z "$mine" ]; then
            echo "::error::This job reported no start time, so the preview queue cannot be ordered."
            exit 1
          fi
          echo "This job started at ${mine}."
          deadline=$((SECONDS + QUEUE_DEADLINE_MINUTES * 60))
          while :; do
            busy=""
            for run_status in queued in_progress waiting pending requested; do
              others=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=${run_status}&per_page=100" \
                --jq ".workflow_runs[] | select(.name == \"${GITHUB_WORKFLOW}\" and .id != ${RUN_ID}) | .id")
              for id in $others; do
                ahead=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" \
                  --jq "[.jobs[] | select(.name == \"${JOB_NAME}\" and .status != \"completed\" and .started_at != null)]
                        | map(select(.started_at < \"${mine}\" or (.started_at == \"${mine}\" and ${id} < ${RUN_ID})))
                        | if length == 0 then empty else .[0].started_at end" | head -n 1)
                if [ -n "$ahead" ]; then
                  busy="${busy} ${id}(started ${ahead})"
                fi
              done
            done
            if [ -z "$busy" ]; then
              echo "Preview is free."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Gave up after ${QUEUE_DEADLINE_MINUTES} minutes waiting on runs ahead of this one:${busy}"
              exit 1
            fi
            echo "Waiting on runs ahead of this one:${busy}"
            sleep 30
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: preview-worker-${{ github.sha }}
          path: .output
      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          auth_secret="$(openssl rand -base64 32)"
          password="$(openssl rand -hex 32)Aa1!"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$password"
          {
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "E2E_TEST_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Check pre-provisioned preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          corepack yarn wrangler secret list --env preview --format json > "$RUNNER_TEMP/preview-secrets.json"
          for secret_name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PREVIEW_SECRET E2E_DEV_ROUTE_SECRET EMAIL_REPLY_SECRET; do
            jq -e --arg name "$secret_name" '.. | objects | select((.name? // .key?) == $name)' "$RUNNER_TEMP/preview-secrets.json" >/dev/null
          done
      - name: Sweep the previous run's e2e organizations and their Stripe test customers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/reset-e2e-artifacts.ts --preview --older-than-hours=0
      - name: Reset and migrate preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn db:reset:preview --apply --confirm-configured-preview
      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --env preview --strict
      - name: Restore preview from a production snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn db:pull:preview
      - name: Provision preview Better Auth fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/provision-development-auth.ts --preview
      - name: Verify preview fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn fixtures:verify:preview
      - name: Run the preview smoke suite
        run: yarn test:e2e:preview:smoke

  e2e-staging:
    name: Deploy and test staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    # The same seven preview cases gate the exact staging SHA. A direct push to
    # staging is the normal way a hotfix ships, and nothing else would have run
    # them on that commit.
    needs: [typecheck, e2e-preview-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://staging.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw Staging
      NUXT_PUBLIC_SITE_URL: https://staging.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://staging.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://staging.krabiclaw.com
      MCP_BASE_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install --with-deps chromium
      - name: Build staging Worker
        run: yarn build
      - name: Capture Nuxt build ID
        id: nuxt_build
        run: |
          build_id="$(node -p 'JSON.parse(require("node:fs").readFileSync(".output/public/_nuxt/builds/latest.json", "utf8")).id')"
          printf 'id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"
      # Migrations run before the deploy. A migration is backward compatible with the
      # Worker already running -- contractions ship a release after the code that
      # stopped reading the column -- so the old Worker keeps serving against the new
      # schema, and the new Worker never meets a schema it predates. Deploying first
      # leaves a window of new code against old schema, and a failed migration would
      # leave that code live.
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --env staging --strict
      - name: Refresh staging AI Search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
          SEARCH_BASE_SHA: ${{ github.event.before }}
          SEARCH_HEAD_SHA: ${{ github.sha }}
        run: yarn ai-search:sync:staging --changed-since "$SEARCH_BASE_SHA" --changed-until "$SEARCH_HEAD_SHA"
      - name: Verify staging AI Search
        run: curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 "https://staging.krabiclaw.com/api/public/search?q=booking&type=all&surface=public"
      - name: Run read-only tenant MCP discovery smoke
        run: yarn test:mcp
      # A Worker version reaches colos gradually. Until every colo serves the new
      # version, one colo renders the page while another serves the assets, and the
      # old build's chunks 404. Production already waits for this; staging did not,
      # and its first run after a deploy failed on exactly that.
      - name: Wait for staging assets to converge
        env:
          EXPECTED_NUXT_BUILD_ID: ${{ steps.nuxt_build.outputs.id }}
        run: >-
          node scripts/wait-for-nuxt-deployment.mjs
          https://pottery-house-staging.krabiclaw.com
          https://kikuzuki-krabi-thailand-staging.krabiclaw.com
          https://ncls-staging.krabiclaw.com
      - name: Run read-only tenant rendering
        run: yarn test:e2e:tenant-rendering
      - name: Upload staging Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-staging
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  staging-qualified:
    name: Staging candidate qualified
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing in this repository's settings requires staging to be green
      # before main deploys: there is no branch protection and no ruleset. This
      # job is that requirement, expressed as a dependency rather than as a
      # setting nobody can see from the tree.
      #
      # One read of one commit's check runs. It does not wait for anything: by
      # the time main has the commit, staging has either qualified it or not.
      - name: Require the staging candidate's checks to be green
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: |
            Checks
            Preview smoke
            Deploy and test staging
        run: |
          set -euo pipefail
          # staging reaches main as a merge commit, so the candidate is the
          # second parent. A fast-forward has one parent and is its own
          # candidate.
          candidate=$(git rev-parse "HEAD^2" 2>/dev/null || git rev-parse HEAD)
          echo "Staging candidate: ${candidate}"
          runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${candidate}/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.id)\t\(.status)\t\(.conclusion // "pending")\t\(.name)"')
          echo "${runs}"
          # A re-run adds a newer check run beside the old one; only the latest
          # run of each required check counts, and it must have completed.
          missing=""
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            latest=$(printf '%s\n' "${runs}" | awk -F'\t' -v name="${name}" '$4 == name' | sort -n | tail -n 1)
            status=$(printf '%s' "${latest}" | cut -f2)
            conclusion=$(printf '%s' "${latest}" | cut -f3)
            if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
              missing="${missing} '${name}'(${status:-absent}/${conclusion:-none})"
            fi
          done <<< "$REQUIRED"
          if [ -n "$missing" ]; then
            echo "::error::Staging candidate ${candidate} has no latest successful:${missing}. Production deploys the exact commit staging qualified."
            exit 1
          fi
          echo "Staging candidate ${candidate} is qualified."

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, staging-qualified]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    outputs:
      nuxt_build_id: ${{ steps.nuxt_build.outputs.id }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://krabiclaw.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - name: Build production Worker
        run: yarn build
      - name: Capture Nuxt build ID
        id: nuxt_build
        run: |
          build_id="$(node -p 'JSON.parse(require("node:fs").readFileSync(".output/public/_nuxt/builds/latest.json", "utf8")).id')"
          printf 'id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"
      # Migrations before the deploy, for the reason given in the staging job.
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler d1 migrations apply DB --remote
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --strict
      - name: Refresh production search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
          SEARCH_BASE_SHA: ${{ github.event.before }}
          SEARCH_HEAD_SHA: ${{ github.sha }}
        run: yarn ai-search:sync:prod --changed-since "$SEARCH_BASE_SHA" --changed-until "$SEARCH_HEAD_SHA"

  verify-production:
    name: Verify production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
      EXPECTED_NUXT_BUILD_ID: ${{ needs.deploy-production.outputs.nuxt_build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install --with-deps chromium
      - name: Wait for production assets to converge
        run: >-
          node scripts/wait-for-nuxt-deployment.mjs
          https://www.potteryhousekrabi.com
          https://www.kikuzuki-thailand.com
          https://www.northcarolinalegalservices.org
      - name: Run read-only production tenant rendering
        run: yarn test:e2e:tenant-rendering
      - name: Upload production Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
