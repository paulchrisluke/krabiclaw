name: CI

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Checks
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.1"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn quality
      - run: yarn test:unit
      - run: yarn mcp:catalog
      - run: yarn lint:seeds
      - run: yarn lint:migrations
      - run: yarn lint:tool-parity
      - run: yarn lint:e2e-environments

  e2e-plan:
    name: Plan affected browser coverage
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    outputs:
      run_preview: ${{ steps.plan.outputs.run_preview }}
      run_full_lanes: ${{ steps.plan.outputs.run_full_lanes }}
      scope: ${{ steps.plan.outputs.scope }}
      preview_scope: ${{ steps.plan.outputs.preview_scope }}
      groups: ${{ steps.plan.outputs.groups }}
      specs: ${{ steps.plan.outputs.specs }}
      preview_specs: ${{ steps.plan.outputs.preview_specs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select coverage from changed files
        id: plan
        env:
          E2E_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          E2E_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/select-preview-e2e.mjs --github-output "$GITHUB_OUTPUT"

  e2e-representative:
    name: E2E representative tests (preview only)
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !(github.base_ref == 'main' && github.head_ref == 'staging')
      && needs.e2e-plan.outputs.run_preview == 'true'
    needs: [typecheck, e2e-plan, e2e-release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: shared-preview-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://preview.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://preview.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://preview.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://preview.krabiclaw.com
      E2E_ALLOW_DEV_ROUTES: "true"
      E2E_DEV_ROUTE_SECRET: ${{ secrets.E2E_DEV_ROUTE_SECRET_PREVIEW }}
      MCP_CREDENTIAL_LOGIN: "1"
      MCP_CIMD_CLIENT_URL: https://preview.krabiclaw.com/api/auth/oauth2/test-client-metadata
      MCP_PRIVATE_CIMD_CLIENT_URL: https://preview.krabiclaw.com/api/auth/oauth2/test-private-client-metadata
      PLAYWRIGHT_PREVIEW_URL: https://preview.krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
      E2E_SELECTION_SCOPE: ${{ needs.e2e-plan.outputs.preview_scope }}
      E2E_SELECTED_SPECS: ${{ needs.e2e-plan.outputs.preview_specs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.1"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-e2e-worker-${{ github.event.pull_request.head.sha }}
          path: .output
      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          auth_secret="$(openssl rand -base64 32)"
          password="$(openssl rand -hex 32)Aa1!"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$password"
          {
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "E2E_TEST_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Check pre-provisioned preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler secret list --env preview --format json > "$RUNNER_TEMP/preview-secrets.json"
          for secret_name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PREVIEW_SECRET E2E_DEV_ROUTE_SECRET EMAIL_REPLY_SECRET EMAIL_INBOUND_SECRET; do
            jq -e --arg name "$secret_name" '.. | objects | select((.name? // .key?) == $name)' "$RUNNER_TEMP/preview-secrets.json" >/dev/null
          done
      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env preview --strict
      - name: Migrate preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --env preview --remote
      - name: Sweep E2E artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/reset-e2e-artifacts.ts --preview
      - name: Seed preview fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/generate-demo-bundle.ts
          node --experimental-strip-types scripts/generate-demo-seed.ts --preview --stdout > /tmp/preview-seed.sql
          node --experimental-strip-types scripts/generate-pottery-house-seed.ts --preview --stdout >> /tmp/preview-seed.sql
          node --experimental-strip-types scripts/generate-kikuzuki-seed.ts --preview --stdout >> /tmp/preview-seed.sql
          node --experimental-strip-types scripts/generate-ncls-seed.ts --stdout >> /tmp/preview-seed.sql
          npx wrangler d1 execute DB --env preview --remote --file /tmp/preview-seed.sql
      - name: Provision preview Better Auth fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/provision-e2e-auth.ts --preview
      - name: Run core and affected preview browser coverage
        run: yarn test:e2e:preview:selected
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-lane-plan:
    name: Plan isolated release E2E lanes
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        (github.base_ref == 'main' && github.head_ref == 'staging')
        || needs.e2e-plan.outputs.run_full_lanes == 'true'
      )
    needs: e2e-plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.1"
          cache: yarn
      - id: plan
        run: node scripts/e2e-lane-matrix.mjs --github-output "$GITHUB_OUTPUT"

  e2e-release-build:
    name: Build deployed E2E artifact
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        (github.base_ref == 'main' && github.head_ref == 'staging')
        || needs.e2e-plan.outputs.run_preview == 'true'
      )
    needs: [e2e-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.1"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-e2e-worker-${{ github.event.pull_request.head.sha }}
          path: .output
          include-hidden-files: true
          retention-days: 2

  e2e-release-qualification:
    name: Full E2E (${{ matrix.lane }}, shard ${{ matrix.shard }}/${{ matrix.total }})
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        (github.base_ref == 'main' && github.head_ref == 'staging')
        || needs.e2e-plan.outputs.run_full_lanes == 'true'
      )
    needs: [typecheck, e2e-plan, e2e-lane-plan, e2e-release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.e2e-lane-plan.outputs.matrix) }}
    concurrency:
      group: release-qualification-e2e-${{ matrix.lane }}
      queue: max
      cancel-in-progress: false
    environment: ${{ matrix.lane }}
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: ${{ matrix.url }}
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw E2E ${{ matrix.lane }}
      NUXT_PUBLIC_SITE_URL: ${{ matrix.url }}
      NUXT_PUBLIC_HELP_URL: ${{ matrix.url }}/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: ${{ matrix.url }}
      E2E_ALLOW_DEV_ROUTES: "true"
      MCP_CREDENTIAL_LOGIN: "1"
      MCP_CIMD_CLIENT_URL: ${{ matrix.url }}/api/auth/oauth2/test-client-metadata
      MCP_PRIVATE_CIMD_CLIENT_URL: ${{ matrix.url }}/api/auth/oauth2/test-private-client-metadata
      PLAYWRIGHT_PREVIEW_URL: ${{ matrix.url }}
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.1"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-e2e-worker-${{ github.event.pull_request.head.sha }}
          path: .output
      - name: Generate ephemeral E2E credentials
        shell: bash
        run: |
          password="$(openssl rand -hex 32)Aa1!"
          dev_route_secret="$(openssl rand -hex 32)"
          stripe_webhook_secret="whsec_$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$dev_route_secret"
          echo "::add-mask::$stripe_webhook_secret"
          {
            echo "E2E_TEST_PASSWORD=$password"
            echo "E2E_DEV_ROUTE_SECRET=$dev_route_secret"
            echo "STRIPE_WEBHOOK_SECRET=$stripe_webhook_secret"
          } >> "$GITHUB_ENV"
      - name: Deploy exact Worker artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_SECRET_VALUE: ${{ secrets.PREVIEW_SECRET }}
          EMAIL_REPLY_SECRET_VALUE: ${{ secrets.EMAIL_REPLY_SECRET }}
          EMAIL_INBOUND_SECRET_VALUE: ${{ secrets.EMAIL_INBOUND_SECRET }}
          PLATFORM_SEARCH_REINDEX_SECRET_VALUE: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
          STRIPE_SECRET_KEY_VALUE: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/e2e-lane-secrets.json"
          remote_secrets_file="$RUNNER_TEMP/e2e-lane-remote-secrets.json"
          trap 'rm -f "$secrets_file" "$remote_secrets_file"' EXIT
          npx wrangler secret list --env "${{ matrix.lane }}" --format json > "$remote_secrets_file"
          jq -e 'map(select(.name == "BETTER_AUTH_SECRET")) | length == 1' "$remote_secrets_file" >/dev/null
          jq -n \
            --arg e2e_dev_route "$E2E_DEV_ROUTE_SECRET" \
            --arg preview "$PREVIEW_SECRET_VALUE" \
            --arg email_reply "$EMAIL_REPLY_SECRET_VALUE" \
            --arg email_inbound "$EMAIL_INBOUND_SECRET_VALUE" \
            --arg search_reindex "$PLATFORM_SEARCH_REINDEX_SECRET_VALUE" \
            --arg stripe "$STRIPE_SECRET_KEY_VALUE" \
            --arg stripe_webhook "$STRIPE_WEBHOOK_SECRET" \
            '{
              E2E_DEV_ROUTE_SECRET: $e2e_dev_route,
              PREVIEW_SECRET: $preview,
              EMAIL_REPLY_SECRET: $email_reply,
              EMAIL_INBOUND_SECRET: $email_inbound,
              PLATFORM_SEARCH_REINDEX_SECRET: $search_reindex,
              STRIPE_SECRET_KEY: $stripe,
              STRIPE_WEBHOOK_SECRET: $stripe_webhook
            }' > "$secrets_file"
          chmod 600 "$secrets_file"
          npx wrangler deploy --env "${{ matrix.lane }}" --strict --secrets-file "$secrets_file"
      - name: Apply lane migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env "${{ matrix.lane }}" --remote
      - name: Sweep lane E2E artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/reset-e2e-artifacts.ts --env "${{ matrix.lane }}" --older-than-hours=0
      - name: Provision deterministic lane fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/provision-staging-fixtures.ts --env "${{ matrix.lane }}"
      - name: Provision ephemeral Better Auth fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/provision-e2e-auth.ts --env "${{ matrix.lane }}"
      - name: Refresh lane AI Search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
        run: yarn ai-search:sync --base-url "${{ matrix.url }}"
      - name: Run isolated lane smoke
        run: yarn test:e2e:lane-smoke
      - name: Run Playwright release shard
        run: yarn test:e2e:full --shard=${{ matrix.shard }}/${{ matrix.total }} --workers=1
      - name: Upload lane Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ matrix.lane }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-staging:
    name: Deploy staging for human review
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [typecheck, e2e-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://staging.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw Staging
      NUXT_PUBLIC_SITE_URL: https://staging.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://staging.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://staging.krabiclaw.com
      E2E_ALLOW_DEV_ROUTES: "true"
      E2E_DEV_ROUTE_SECRET: ${{ secrets.E2E_DEV_ROUTE_SECRET_STAGING }}
      MCP_CREDENTIAL_LOGIN: "1"
      MCP_CIMD_CLIENT_URL: https://staging.krabiclaw.com/api/auth/oauth2/test-client-metadata
      MCP_PRIVATE_CIMD_CLIENT_URL: https://staging.krabiclaw.com/api/auth/oauth2/test-private-client-metadata
      PLAYWRIGHT_PREVIEW_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
      E2E_SELECTION_SCOPE: ${{ needs.e2e-plan.outputs.scope }}
      E2E_SELECTED_SPECS: ${{ needs.e2e-plan.outputs.specs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.1"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: yarn build
      - name: Sync staging search reindex secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
        run: printf '%s' "$PLATFORM_SEARCH_REINDEX_SECRET" | npx wrangler secret put PLATFORM_SEARCH_REINDEX_SECRET --env staging
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging --strict
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Provision deterministic staging fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/provision-staging-fixtures.ts --staging
      - name: Generate ephemeral E2E credentials
        shell: bash
        run: |
          auth_secret="$(openssl rand -base64 32)"
          password="$(openssl rand -hex 32)Aa1!"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$password"
          {
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "E2E_TEST_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Provision staging E2E auth fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/provision-e2e-auth.ts --staging
      - name: Refresh staging AI Search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
        run: yarn ai-search:sync:staging
      - name: Verify staging AI Search
        run: curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 "https://staging.krabiclaw.com/api/public/search?q=booking&type=all&surface=public"
      - name: Provision durable staging-review identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
        run: node --experimental-strip-types scripts/provision-staging-review-auth.ts --staging
      - name: Verify durable staging-review provisioning is idempotent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
        run: node --experimental-strip-types scripts/provision-staging-review-auth.ts --staging
      - name: Verify durable staging-review login
        env:
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
        run: yarn test:e2e:staging-review
      - name: Run OAuth bearer MCP smoke
        if: >-
          needs.e2e-plan.outputs.scope == 'full'
          || contains(needs.e2e-plan.outputs.groups, 'auth-access')
          || contains(needs.e2e-plan.outputs.groups, 'mcp-chowbot')
        run: yarn test:mcp
      - name: Run affected staging browser coverage
        if: needs.e2e-plan.outputs.run_preview == 'true'
        run: yarn test:e2e:preview:selected
      - name: Upload staging Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-staging
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-production:
    name: Deploy and test production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.1"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Build production Worker
        run: yarn build
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --strict
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Run read-only production browser smoke
        run: yarn test:e2e:public-rendering
      - name: Refresh production search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
        run: yarn ai-search:sync:prod
      - name: Upload production Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
