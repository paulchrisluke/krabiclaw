name: CI

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Type check and unit tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn quality
      - run: yarn test:unit
      - run: yarn mcp:compat

  build-production:
    name: Application build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Upload application build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-build
          path: .output
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  guardrails:
    name: CI guardrails
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Run Node-only guardrails
        run: |
          node scripts/check-better-auth-boundaries.mjs
          node scripts/check-product-model-guard.mjs
          node scripts/lint-seeds.mjs
          node scripts/lint-migrations.mjs
          node scripts/lint-tool-parity.mjs
      - name: Check pipeline scripts
        run: |
          for f in \
            scripts/client-import.mjs \
            scripts/client-verify.mjs \
            scripts/client-onboard.mjs \
            scripts/client-override.mjs \
            scripts/client-deploy.mjs \
            scripts/canary-prod.mjs \
            scripts/canary-notifications.mjs \
            scripts/capture-blawby-screenshots.mjs \
            scripts/compare-blawby-screenshots.mjs \
            scripts/rollback-prod.mjs \
            scripts/verify-blawby-site.mjs \
            scripts/lint-seeds.mjs \
            scripts/lint-migrations.mjs \
            scripts/lint-tool-parity.mjs \
            scripts/fixtures/pottery-house-krabi.fixture.mjs; do
            node --check "$f"
          done

  e2e-representative:
    name: E2E representative tests (preview only)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [typecheck, build-production, guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: shared-preview-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://preview.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://preview.krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      BETTER_AUTH_SECRET: test-secret-for-ci
      BETTER_AUTH_URL: https://preview.krabiclaw.com
      E2E_ALLOW_DEV_ROUTES: "true"
      E2E_DEV_ROUTE_SECRET: ${{ secrets.E2E_DEV_ROUTE_SECRET_PREVIEW }}
      PLAYWRIGHT_PREVIEW_URL: https://krabiclaw-preview.paulchrisluke.workers.dev
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Download application build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-build
          path: .output
      - name: Migrate preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          applied="$RUNNER_TEMP/preview-migrations-applied.json"
          pending="$RUNNER_TEMP/preview-migrations-pending.txt"
          npx wrangler d1 execute DB --env preview --remote \
            --command 'SELECT id, name, applied_at FROM d1_migrations ORDER BY id' \
            --json > "$applied"
          node scripts/verify-migration-state.mjs \
            --pre-apply \
            --lineage-marker 0108_reconcile_drizzle_migration_history.sql \
            --migrations-dir migrations \
            --remote-json "$applied"
          npx wrangler d1 migrations list DB --env preview --remote | tee "$pending"
          yarn migrate:check
          npx wrangler d1 migrations apply DB --env preview --remote
      - name: Sweep E2E artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/reset-e2e-artifacts.ts --preview
      - name: Seed preview fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/generate-demo-bundle.ts
          node --experimental-strip-types scripts/generate-demo-seed.ts --preview --stdout > /tmp/preview-seed.sql
          node --experimental-strip-types scripts/generate-pottery-house-seed.ts --preview --stdout >> /tmp/preview-seed.sql
          node --experimental-strip-types scripts/generate-kikuzuki-seed.ts --preview --stdout >> /tmp/preview-seed.sql
          node --experimental-strip-types scripts/generate-blawby-ci-seed.ts --stdout >> /tmp/preview-seed.sql
          npx wrangler d1 execute DB --env preview --remote --file /tmp/preview-seed.sql
      - name: Check pre-provisioned preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler secret list --env preview --format json > "$RUNNER_TEMP/preview-secrets.json"
          for secret_name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PREVIEW_SECRET E2E_DEV_ROUTE_SECRET EMAIL_REPLY_SECRET EMAIL_INBOUND_SECRET; do
            jq -e --arg name "$secret_name" '.. | objects | select((.name? // .key?) == $name)' "$RUNNER_TEMP/preview-secrets.json" >/dev/null
          done
      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env preview --old-asset-ttl 600 --strict
      - name: Purge preview HTML cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_CACHE_ORIGIN: https://preview.krabiclaw.com
        run: node --experimental-strip-types scripts/purge-deployment-cache.ts
      - name: Run required representative browser coverage
        run: |
          yarn test:e2e:representative
          yarn test:e2e:public-rendering
          yarn test:e2e:dashboard:smoke
          yarn test:e2e:blawby-cms:smoke
          yarn test:e2e:smoke:billing
          yarn test:e2e:links-page
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-staging:
    name: Deploy and test staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [typecheck, build-production, guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://staging.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://staging.krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      BETTER_AUTH_SECRET: test-secret-for-ci
      BETTER_AUTH_URL: https://staging.krabiclaw.com
      E2E_ALLOW_DEV_ROUTES: "true"
      E2E_DEV_ROUTE_SECRET: ${{ secrets.E2E_DEV_ROUTE_SECRET_STAGING }}
      PLAYWRIGHT_PREVIEW_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Download application build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-build
          path: .output
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          yarn migrate:check
          npx wrangler d1 migrations apply DB --env staging --remote
      - name: Sweep staging E2E artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/reset-e2e-artifacts.ts --staging
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging --old-asset-ttl 600 --strict
      - name: Purge staging HTML cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_CACHE_ORIGIN: https://staging.krabiclaw.com
        run: node --experimental-strip-types scripts/purge-deployment-cache.ts
      - name: Run full staging E2E suite
        run: yarn test:e2e:full
      - name: Upload staging Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-staging
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-production:
    name: Deploy and test production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, build-production, guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      BETTER_AUTH_URL: https://krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Download application build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-build
          path: .output
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          yarn migrate:check
          npx wrangler d1 migrations apply DB --remote
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --old-asset-ttl 600 --strict
      - name: Purge production HTML cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_CACHE_ORIGIN: https://krabiclaw.com
        run: node --experimental-strip-types scripts/purge-deployment-cache.ts
      - name: Run read-only production browser smoke
        run: yarn test:e2e:public-rendering
      - name: Refresh production search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
        run: yarn ai-search:sync:prod
      - name: Upload production Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
