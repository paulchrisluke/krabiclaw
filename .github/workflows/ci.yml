name: CI

# Drafts run the static Checks; the preview qualification starts at
# ready_for_review.

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Checks
    # Drafts run Checks; only the preview qualification below waits for ready.
    if: >-
      github.event_name == 'push'
      || !(github.base_ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Hardened immutable installs
        env:
          YARN_ENABLE_HARDENED_MODE: "1"
        run: corepack yarn install --immutable
      - run: yarn quality
      - run: yarn test:unit
      - run: yarn test:d1
      - run: yarn mcp:catalog
      - run: yarn chatgpt:submission:check
      - run: yarn lint:migrations
      - run: yarn lint:schema-drift
      - run: yarn test:migrations

  e2e:
    name: E2E
    # The whole suite, on every pull request, against a local build and a local
    # D1 pulled from production. Before this, a pull request ran Checks and
    # nothing else, and e2e-staging ran only test:e2e:tenant-rendering after the
    # merge had already happened — two specs of nineteen. tenant-guest-journeys,
    # every mcp-* spec, oauth-discovery and provider-ingress had never run in CI
    # anywhere, which is how the suite reached twenty-two failures with no one
    # told. The playwright.config comment about "a test broken by #1001 sat
    # failing while only the @smoke subset ran in CI" is the same gap, a year on.
    if: >-
      github.event_name == 'pull_request'
      && !(github.base_ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install --with-deps chromium
      # playwright.config.ts runs e2e:local:prepare itself when the worker is not
      # already prepared: local migrations, a production snapshot into local D1,
      # development auth, and the production build.
      - run: yarn test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-pr
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-staging:
    name: Deploy and test staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    # Staging is the first deployed validation: a pull request runs Checks and
    # nothing else. A direct push to staging is the normal way a hotfix ships,
    # so Checks gates this exact SHA before the deploy.
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://staging.krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw Staging
      NUXT_PUBLIC_SITE_URL: https://staging.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://staging.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://staging.krabiclaw.com
      MCP_BASE_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install --with-deps chromium
      - name: Build staging Worker
        run: yarn build
      - name: Capture Nuxt build ID
        id: nuxt_build
        run: |
          build_id="$(node -p 'JSON.parse(require("node:fs").readFileSync(".output/public/_nuxt/builds/latest.json", "utf8")).id')"
          printf 'id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"
      # Migrations run before the deploy. A migration is backward compatible with the
      # Worker already running -- contractions ship a release after the code that
      # stopped reading the column -- so the old Worker keeps serving against the new
      # schema, and the new Worker never meets a schema it predates. Deploying first
      # leaves a window of new code against old schema, and a failed migration would
      # leave that code live.
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --env staging --strict
      - name: Refresh staging AI Search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
          SEARCH_BASE_SHA: ${{ github.event.before }}
          SEARCH_HEAD_SHA: ${{ github.sha }}
        run: yarn ai-search:sync:staging --changed-since "$SEARCH_BASE_SHA" --changed-until "$SEARCH_HEAD_SHA"
      - name: Verify staging AI Search
        run: curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 "https://staging.krabiclaw.com/api/public/search?q=booking&type=all&surface=public"
      - name: Run read-only tenant MCP discovery smoke
        run: yarn test:mcp
      # A Worker version reaches colos gradually. Until every colo serves the new
      # version, one colo renders the page while another serves the assets, and the
      # old build's chunks 404. Production already waits for this; staging did not,
      # and its first run after a deploy failed on exactly that.
      - name: Wait for staging assets to converge
        env:
          EXPECTED_NUXT_BUILD_ID: ${{ steps.nuxt_build.outputs.id }}
        run: >-
          node scripts/wait-for-nuxt-deployment.mjs
          https://pottery-house-staging.krabiclaw.com
          https://kikuzuki-krabi-thailand-staging.krabiclaw.com
          https://ncls-staging.krabiclaw.com
      - name: Run read-only tenant rendering
        run: yarn test:e2e:tenant-rendering
      - name: Upload staging Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-staging
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    outputs:
      nuxt_build_id: ${{ steps.nuxt_build.outputs.id }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://krabiclaw.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - name: Build production Worker
        run: yarn build
      - name: Capture Nuxt build ID
        id: nuxt_build
        run: |
          build_id="$(node -p 'JSON.parse(require("node:fs").readFileSync(".output/public/_nuxt/builds/latest.json", "utf8")).id')"
          printf 'id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"
      # Migrations before the deploy, for the reason given in the staging job.
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler d1 migrations apply DB --remote
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --strict
      - name: Refresh production search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
          SEARCH_BASE_SHA: ${{ github.event.before }}
          SEARCH_HEAD_SHA: ${{ github.sha }}
        run: yarn ai-search:sync:prod --changed-since "$SEARCH_BASE_SHA" --changed-until "$SEARCH_HEAD_SHA"

  verify-production:
    name: Verify production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_SITE_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
      EXPECTED_NUXT_BUILD_ID: ${{ needs.deploy-production.outputs.nuxt_build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install --with-deps chromium
      - name: Wait for production assets to converge
        run: >-
          node scripts/wait-for-nuxt-deployment.mjs
          https://www.potteryhousekrabi.com
          https://www.kikuzuki-thailand.com
          https://www.northcarolinalegalservices.org
      - name: Run read-only production tenant rendering
        run: yarn test:e2e:tenant-rendering
      - name: Upload production Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
