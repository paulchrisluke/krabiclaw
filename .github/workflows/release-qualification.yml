name: Release qualification

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: release-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-qualification:
    name: Release qualification
    if: >-
      github.event.pull_request.draft == false
      && !(github.base_ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - name: Plan required preview coverage
        id: plan
        env:
          E2E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/select-preview-e2e.mjs --github-output "$GITHUB_OUTPUT"
      - name: Accept explicitly unaffected changes
        if: steps.plan.outputs.run_preview == 'false'
        run: echo "Preview E2E explicitly not required for this change."
      - name: Wait for required preview E2E
        if: steps.plan.outputs.run_preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: E2E representative tests (preview only)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 185 * 60))
          while :; do
            check=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${CHECK_NAME}\")] | sort_by(.id) | last // empty")

            if [ -n "$check" ]; then
              status=$(jq -r '.status' <<<"$check")
              conclusion=$(jq -r '.conclusion // ""' <<<"$check")
              url=$(jq -r '.html_url' <<<"$check")
              echo "${CHECK_NAME}: status=${status} conclusion=${conclusion:-pending} ${url}"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "::error::${CHECK_NAME} finished as ${conclusion:-unknown}."
                exit 1
              fi
            else
              echo "Waiting for ${CHECK_NAME} to appear for ${HEAD_SHA}."
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for ${CHECK_NAME}."
              exit 1
            fi
            sleep 30
          done
      - name: Reject an invalid preview plan
        if: >-
          steps.plan.outputs.run_preview != 'true'
          && steps.plan.outputs.run_preview != 'false'
        env:
          RUN_PREVIEW: ${{ steps.plan.outputs.run_preview }}
        run: |
          echo "::error::Invalid run_preview value: '${RUN_PREVIEW}'"
          exit 1
