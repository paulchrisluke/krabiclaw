name: Zaraz GA4 Backfill Plan

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare/D1 environment to inspect
        required: true
        default: staging
        type: choice
        options:
          - staging
          - preview

permissions:
  contents: read

jobs:
  sync:
    name: Plan Zaraz GA4 configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Generate read-only Zaraz GA4 plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZARAZ_API_TOKEN: ${{ secrets.CF_ZARAZ_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          case "${{ inputs.target }}" in
            staging) target_flag="--staging" ;;
            preview) target_flag="--preview" ;;
            production) echo "Production Zaraz configuration has no operator apply or plan path." >&2; exit 1 ;;
            *) echo "Unsupported target: ${{ inputs.target }}" >&2; exit 1 ;;
          esac

          node scripts/zaraz-ga-backfill.mjs "$target_flag" --dry-run
