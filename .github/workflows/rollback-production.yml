          EVIDENCE="$evidence" node -e 'const fs=require("node:fs");fs.writeFileSync(process.env.EVIDENCE,JSON.stringify({status:"intervention_required",reason:"A post-mutation gate failed; exact declared baseline restoration and cache purge were verified.",expectedCurrentWorkerVersionId:process.env.EXPECTED_CURRENT_WORKER_VERSION_ID,targetWorkerVersionId:process.env.TARGET_WORKER_VERSION_ID,restored:true},null,2)+"\n")'
