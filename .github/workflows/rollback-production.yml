name: Production rollback (exact-target, manifest-gated)

on:
  workflow_dispatch:
    inputs:
      expected_current_worker_version_id:
        description: Exact currently active production Worker version ID. The workflow fails if production differs.
        required: true
        type: string
      target_worker_version_id:
        description: Exact immutable Worker version ID to route to after approval.
        required: true
        type: string
      target_source_sha:
        description: Exact 40-character target source SHA; modern versions require that exact tag and the reviewed legacy target uses its hard-bound release attestation.
        required: true
        type: string
      incident_reason:
        description: Incident identifier and reason for this rollback; retained in the evidence artifact.
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  LEGACY_TARGET_SOURCE_SHA: 4e49e5a37e4a0578bd1b306c4e0822c4fa8bc5c9
  LEGACY_TARGET_WORKER_VERSION_ID: 6254de48-c029-418b-b82f-a4811fb04814
  LEGACY_TARGET_RELEASE_RUN_ID: "31142677520"

# Emergency rollback shares the normal production release lock so a release and
# a rollback can never race. The protected production Environment is the
# approval boundary for the mutation job only.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  production-environment-preflight:
    name: Verify protected production Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require mandatory production reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/production-environment.json"
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/environments/production"
          http_status="$(curl -sS --connect-timeout 10 --max-time 20 --retry 0 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "$response" \
            -w '%{http_code}' \
            "$api_url")"
          if [[ "$http_status" != "200" ]]; then
            echo "GitHub production Environment API returned HTTP $http_status; rollback is blocked" >&2
            exit 1
          fi
          if ! jq -e '
            .name == "production"
            and ((.protection_rules | type) == "array")
            and (
              [
                .protection_rules[]?
                | select(.type == "required_reviewers" and .prevent_self_review == true)
                | (.reviewers // [])
                | select(type == "array")
                | .[]
                | select(
                    type == "object"
                    and (.reviewer | type == "object")
                    and ((.reviewer.login? // .reviewer.name? // .reviewer.slug?) | type == "string" and length > 0)
                  )
              ] | length
            ) > 0
          ' "$response" >/dev/null; then
            echo "Production Environment lacks a non-self required reviewer; rollback is blocked" >&2
            exit 1
          fi
          echo "Verified protected production Environment. No deployment was attempted."

  preflight:
    name: Read-only exact-target rollback preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_CURRENT_WORKER_VERSION_ID: ${{ inputs.expected_current_worker_version_id }}
      TARGET_WORKER_VERSION_ID: ${{ inputs.target_worker_version_id }}
      TARGET_SOURCE_SHA: ${{ inputs.target_source_sha }}
      INCIDENT_REASON: ${{ inputs.incident_reason }}
      WORKER_NAME: krabiclaw
      PRODUCTION_BASE_URL: https://krabiclaw.com
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.target_source_sha }}
          path: target-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Install target-source dependencies
        working-directory: target-source
        run: yarn install --frozen-lockfile
      - name: Validate exact target checkout
        run: |
          set -euo pipefail
          uuid_pattern='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$EXPECTED_CURRENT_WORKER_VERSION_ID" =~ $uuid_pattern ]]
          [[ "$TARGET_WORKER_VERSION_ID" =~ $uuid_pattern ]]
          [[ "$EXPECTED_CURRENT_WORKER_VERSION_ID" != "$TARGET_WORKER_VERSION_ID" ]]
          [[ "$TARGET_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$INCIDENT_REASON"
          control_plane_sha="$(git rev-parse HEAD)"
          target_source_sha="$(git -C target-source rev-parse HEAD)"
          test "${control_plane_sha,,}" = "${GITHUB_SHA,,}"
          test "${target_source_sha,,}" = "${TARGET_SOURCE_SHA,,}"
          CONTROL_PLANE_SOURCE_SHA="$control_plane_sha" TARGET_SOURCE_SHA="$target_source_sha" \
            node -e 'const fs=require("node:fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/rollback-source-identities.json",JSON.stringify({controlPlaneSourceSha:process.env.CONTROL_PLANE_SOURCE_SHA,targetSourceSha:process.env.TARGET_SOURCE_SHA},null,2)+"\n")'
      - name: Build exact target once
        working-directory: target-source
        run: yarn build
      - name: Hash immutable target build
        run: |
          set -euo pipefail
          test -f target-source/.output/server/index.mjs
          file_count="$(find target-source/.output -type f | wc -l | tr -d ' ')"
          tree_sha256="$(cd target-source/.output && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          server_entry_sha256="$(sha256sum target-source/.output/server/index.mjs | awk '{print $1}')"
          BUILD_FILE_COUNT="$file_count" BUILD_TREE_SHA256="$tree_sha256" SERVER_ENTRY_SHA256="$server_entry_sha256" \
            node -e 'const fs=require("node:fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/rollback-build-identity.json",JSON.stringify({sourceSha:process.env.TARGET_SOURCE_SHA,artifact:"target-source/.output",fileCount:Number(process.env.BUILD_FILE_COUNT),treeSha256:process.env.BUILD_TREE_SHA256,serverEntrySha256:process.env.SERVER_ENTRY_SHA256},null,2)+"\n")'
      - name: Generate immutable release route inventory from target source
        working-directory: target-source
        run: |
          set -euo pipefail
          if [[ "$TARGET_SOURCE_SHA" == "$LEGACY_TARGET_SOURCE_SHA" && "$TARGET_WORKER_VERSION_ID" == "$LEGACY_TARGET_WORKER_VERSION_ID" ]]; then
            # One-time bridge for the attributable target whose checkout
            # predates the release verifier/spec. There is intentionally no
            # generic missing-file fallback.
            test ! -e scripts/release-route-inventory.mjs
            test ! -e tests/e2e/public-rendering-sentinel.spec.ts
            node ../scripts/legacy-rollback-route-inventory-4e49e5a37e4a0578bd1b306c4e0822c4fa8bc5c9.mjs \
              --base-url "$PRODUCTION_BASE_URL" --output "$RUNNER_TEMP/release-route-inventory.json"
          else
            test -f scripts/release-route-inventory.mjs
            test -f tests/e2e/public-rendering-sentinel.spec.ts
            node scripts/release-route-inventory.mjs --base-url "$PRODUCTION_BASE_URL" --output "$RUNNER_TEMP/release-route-inventory.json"
          fi
      - name: Prove current traffic and target provenance (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          current_status="$RUNNER_TEMP/current-production-deployment.json"
          target_version="$RUNNER_TEMP/target-worker-version.json"
          legacy_run="$RUNNER_TEMP/legacy-target-release-run.json"
          npx wrangler deployments status --name "$WORKER_NAME" --json > "$current_status"
          npx wrangler versions view "$TARGET_WORKER_VERSION_ID" --json > "$target_version"
          if [[ "$TARGET_SOURCE_SHA" == "$LEGACY_TARGET_SOURCE_SHA" || "$TARGET_WORKER_VERSION_ID" == "$LEGACY_TARGET_WORKER_VERSION_ID" ]]; then
            test "$TARGET_SOURCE_SHA" = "$LEGACY_TARGET_SOURCE_SHA"
            test "$TARGET_WORKER_VERSION_ID" = "$LEGACY_TARGET_WORKER_VERSION_ID"
            test "$LEGACY_TARGET_RELEASE_RUN_ID" = "31142677520"
            gh run view "$LEGACY_TARGET_RELEASE_RUN_ID" --json conclusion,event,headSha,workflowName,jobs > "$legacy_run"
          fi
          CURRENT_STATUS_PATH="$current_status" TARGET_VERSION_PATH="$target_version" LEGACY_RUN_PATH="$legacy_run" \
          EXPECTED_CURRENT_WORKER_VERSION_ID="$EXPECTED_CURRENT_WORKER_VERSION_ID" TARGET_WORKER_VERSION_ID="$TARGET_WORKER_VERSION_ID" TARGET_SOURCE_SHA="$TARGET_SOURCE_SHA" \
            node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'

          const readJson = (path) => { try { return JSON.parse(readFileSync(path, 'utf8')) } catch { return null } }
          const idOf = (version) => version?.version_id ?? version?.versionId ?? version?.id
          const trafficOf = (version) => Number(version?.percentage ?? version?.traffic ?? NaN)
          const rowsOf = (value, label) => {
            const deployment = value?.latest_deployment ?? value
            const versions = Array.isArray(deployment?.versions) ? deployment.versions : []
            if (versions.length === 0) throw new Error(`${label} deployment state is missing versions`)
            const rows = versions.map((version) => ({ id: idOf(version), traffic: trafficOf(version) }))
            if (rows.some((row) => typeof row.id !== 'string' || !Number.isFinite(row.traffic) || row.traffic < 0 || row.traffic > 100)) {
              throw new Error(`${label} deployment state contains an unknown version or traffic value`)
            }
            const total = rows.reduce((sum, row) => sum + row.traffic, 0)
            if (Math.abs(total - 100) > 0.001) throw new Error(`${label} deployment traffic does not total 100%`)
            return rows
          }
          const findVersion = (root, expectedId) => {
            const queue = [root]
            while (queue.length) {
              const value = queue.shift()
              if (!value || typeof value !== 'object') continue
              if (Array.isArray(value)) {
                queue.push(...value)
                continue
              }
              if (idOf(value) === expectedId) return value
              queue.push(...Object.values(value))
            }
            return null
          }
          const expectedCurrent = process.env.EXPECTED_CURRENT_WORKER_VERSION_ID
          const targetId = process.env.TARGET_WORKER_VERSION_ID
          const sourceSha = process.env.TARGET_SOURCE_SHA.toLowerCase()
          const currentRows = rowsOf(readJson(process.env.CURRENT_STATUS_PATH), 'Current production')
          const currentActive = currentRows.filter((row) => row.traffic > 0)
          if (currentActive.length !== 1 || currentActive[0].id !== expectedCurrent || currentActive[0].traffic !== 100) {
            throw new Error(`Expected current Worker ${expectedCurrent} at 100%; production traffic is different or ambiguous`)
          }
          const targetMetadata = findVersion(readJson(process.env.TARGET_VERSION_PATH), targetId)
          if (!targetMetadata) throw new Error(`Target Worker version ${targetId} was not found in versions view output`)
          const targetTag = targetMetadata.tag ?? targetMetadata.worker_tag ?? targetMetadata.version_tag ?? targetMetadata.metadata?.tag ?? targetMetadata.annotations?.tag ?? targetMetadata.annotations?.['workers/tag']
          const legacySha = process.env.LEGACY_TARGET_SOURCE_SHA
          const legacyVersionId = process.env.LEGACY_TARGET_WORKER_VERSION_ID
          const isLegacySha = sourceSha === legacySha
          const isLegacyVersion = targetId === legacyVersionId
          if (isLegacySha !== isLegacyVersion) throw new Error('The legacy rollback bridge requires its exact source SHA and Worker version ID together')

          let attestation
          if (isLegacySha) {
            if (targetTag !== undefined && targetTag !== null && targetTag !== '') throw new Error('The reviewed legacy Worker unexpectedly has a tag; its historical attestation is no longer an exact match')
            const createdOn = targetMetadata.created_on ?? targetMetadata.createdOn ?? targetMetadata.created_at ?? targetMetadata.createdAt ?? targetMetadata.metadata?.created_on ?? targetMetadata.metadata?.createdAt
            if (createdOn !== '2026-08-07T02:59:37.401932Z') throw new Error('The reviewed legacy Worker creation timestamp differs from the hard-bound provider observation')
            const parsedCreatedOn = Date.parse(createdOn)
            if (!Number.isFinite(parsedCreatedOn)) throw new Error('The reviewed legacy Worker is missing its provider creation timestamp')
            const targetCreatedOn = new Date(parsedCreatedOn).toISOString()
            if (targetCreatedOn !== '2026-08-07T02:59:37.401Z') throw new Error('The reviewed legacy Worker normalized creation timestamp differs from the hard-bound provider observation')
            const run = readJson(process.env.LEGACY_RUN_PATH)
            if (!run || run.conclusion !== 'success' || run.event !== 'push' || run.headSha !== legacySha || run.workflowName !== 'CI (Required PR Lane)') throw new Error('The reviewed legacy Actions run metadata does not match the hard-bound release')
            const jobs = Array.isArray(run.jobs) ? run.jobs : []
            const matchingJobs = jobs.filter((job) => job?.name === 'Deploy to production')
            if (matchingJobs.length !== 1) throw new Error('The reviewed legacy Actions run has an ambiguous production deploy job')
            const job = matchingJobs[0]
            if (job.databaseId !== 92755644796 || job.conclusion !== 'success' || job.startedAt !== '2026-08-07T02:54:23Z' || job.completedAt !== '2026-08-07T03:01:44Z') throw new Error('The reviewed legacy production deploy job window differs from the hard-bound observation')
            if (!(Date.parse(job.startedAt) <= parsedCreatedOn && parsedCreatedOn <= Date.parse(job.completedAt))) throw new Error('The reviewed legacy Worker was not created inside the hard-bound production deploy job window')
            attestation = {
              type: 'historical-actions-run-window-and-provider-created-on',
              runId: Number(process.env.LEGACY_TARGET_RELEASE_RUN_ID),
              runHeadSha: run.headSha,
              workflowName: run.workflowName,
              event: run.event,
              conclusion: run.conclusion,
              deployJob: { databaseId: job.databaseId, name: job.name, conclusion: job.conclusion, startedAt: job.startedAt, completedAt: job.completedAt },
              workerCreatedOnRaw: createdOn,
              workerCreatedOn: targetCreatedOn,
              runJsonSha256: createHash('sha256').update(readFileSync(process.env.LEGACY_RUN_PATH)).digest('hex'),
              definitiveCandidateProof: 'protected-zero-traffic-exact-assets-and-browser',
            }
          } else {
            if (typeof targetTag !== 'string' || targetTag.toLowerCase() !== sourceSha) {
              throw new Error(`Modern target Worker version ${targetId} is not tagged with source SHA ${sourceSha}`)
            }
            attestation = { type: 'version-tag', tag: targetTag }
          }
          writeFileSync(process.env.RUNNER_TEMP + '/rollback-worker-state.json', `${JSON.stringify({
            schemaVersion: 1,
            current: { expectedVersionId: expectedCurrent, active: currentActive[0], versions: currentRows },
            target: { versionId: targetId, sourceSha, tag: typeof targetTag === 'string' ? targetTag.toLowerCase() : null, attestation, metadata: targetMetadata },
            status: 'verified',
          }, null, 2)}\n`)
          NODE
      - name: Write read-only rollback preflight manifest
        if: always()
        run: |
          set -euo pipefail
          BUILD_IDENTITY_PATH="$RUNNER_TEMP/rollback-build-identity.json" \
          SOURCE_IDENTITIES_PATH="$RUNNER_TEMP/rollback-source-identities.json" \
          WORKER_STATE_PATH="$RUNNER_TEMP/rollback-worker-state.json" \
          ROUTE_INVENTORY_PATH="$RUNNER_TEMP/release-route-inventory.json" \
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'))
          const manifest = {
            schemaVersion: 1,
            kind: 'production-exact-target-rollback-preflight',
            status: 'attested',
            incidentReason: process.env.INCIDENT_REASON,
            expectedCurrentWorkerVersionId: process.env.EXPECTED_CURRENT_WORKER_VERSION_ID,
            targetWorkerVersionId: process.env.TARGET_WORKER_VERSION_ID,
            targetSourceSha: process.env.TARGET_SOURCE_SHA.toLowerCase(),
            sourceIdentities: readJson(process.env.SOURCE_IDENTITIES_PATH),
            build: readJson(process.env.BUILD_IDENTITY_PATH),
            routeInventory: readJson(process.env.ROUTE_INVENTORY_PATH),
            workerState: readJson(process.env.WORKER_STATE_PATH),
            mutationAttempted: false,
            dataWrites: false,
          }
          writeFileSync(process.env.RUNNER_TEMP + '/production-rollback-preflight.json', `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          {
            echo "## Production exact-target rollback preflight"
            echo "- Incident: $INCIDENT_REASON"
            echo "- Expected current Worker: `$EXPECTED_CURRENT_WORKER_VERSION_ID`"
            echo "- Exact target Worker: `$TARGET_WORKER_VERSION_ID`"
            echo "- Target source SHA: `$TARGET_SOURCE_SHA`"
            echo "- Route inventory: platform, Saya, and Blawby surfaces"
            jq -r '"- Status: "+.status+"; protected approval is still required before routing traffic"' "$RUNNER_TEMP/production-rollback-preflight.json"
            echo "- Target HTTP and browser proof is deferred until the protected job places it in the current deployment at 0% traffic"
            echo "- No production data, fixture, or provider writes were performed"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable rollback preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-rollback-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-rollback-preflight.json
            ${{ runner.temp }}/rollback-build-identity.json
            ${{ runner.temp }}/rollback-source-identities.json
            ${{ runner.temp }}/rollback-worker-state.json
            ${{ runner.temp }}/legacy-target-release-run.json
            ${{ runner.temp }}/release-route-inventory.json
            target-source/.output
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  rollback-production:
    name: Route exact target after protected approval
    needs: [production-environment-preflight, preflight]
    if: needs.production-environment-preflight.result == 'success' && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 90
    env:
      EXPECTED_CURRENT_WORKER_VERSION_ID: ${{ inputs.expected_current_worker_version_id }}
      TARGET_WORKER_VERSION_ID: ${{ inputs.target_worker_version_id }}
      TARGET_SOURCE_SHA: ${{ inputs.target_source_sha }}
      INCIDENT_REASON: ${{ inputs.incident_reason }}
      WORKER_NAME: krabiclaw
      PRODUCTION_BASE_URL: https://krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://krabiclaw.com
      PREFLIGHT_ARTIFACT_NAME: production-rollback-preflight-${{ github.run_id }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.target_source_sha }}
          path: target-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Install target-source dependencies
        working-directory: target-source
        run: yarn install --frozen-lockfile
      - name: Download and attest exact preflight artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PREFLIGHT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/rollback-preflight
      - name: Validate preflight artifact and reuse its build
        run: |
          set -euo pipefail
          uuid_pattern='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$EXPECTED_CURRENT_WORKER_VERSION_ID" =~ $uuid_pattern ]]
          [[ "$TARGET_WORKER_VERSION_ID" =~ $uuid_pattern ]]
          [[ "$EXPECTED_CURRENT_WORKER_VERSION_ID" != "$TARGET_WORKER_VERSION_ID" ]]
          [[ "$TARGET_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA,,}" = "$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          manifest="$RUNNER_TEMP/rollback-preflight/production-rollback-preflight.json"
          test -f "$manifest"
          jq -e --arg current "$EXPECTED_CURRENT_WORKER_VERSION_ID" --arg target "$TARGET_WORKER_VERSION_ID" --arg sha "${TARGET_SOURCE_SHA,,}" --arg control "${GITHUB_SHA,,}" --arg legacySha "$LEGACY_TARGET_SOURCE_SHA" --arg legacyVersion "$LEGACY_TARGET_WORKER_VERSION_ID" --argjson legacyRun "$LEGACY_TARGET_RELEASE_RUN_ID" \
            '.status == "attested" and .dataWrites == false and .mutationAttempted == false and .expectedCurrentWorkerVersionId == $current and .targetWorkerVersionId == $target and .targetSourceSha == $sha and .sourceIdentities.controlPlaneSourceSha == $control and .sourceIdentities.targetSourceSha == $sha and .build.sourceSha == $sha and .routeInventory.requiredSurfaces == ["platform", "saya", "blawby"] and .workerState.status == "verified" and .workerState.current.expectedVersionId == $current and .workerState.current.active.id == $current and .workerState.current.active.traffic == 100 and .workerState.target.versionId == $target and .workerState.target.sourceSha == $sha and (if $sha == $legacySha or $target == $legacyVersion then $sha == $legacySha and $target == $legacyVersion and .workerState.target.tag == null and .workerState.target.attestation.type == "historical-actions-run-window-and-provider-created-on" and .workerState.target.attestation.runId == $legacyRun and .workerState.target.attestation.definitiveCandidateProof == "protected-zero-traffic-exact-assets-and-browser" else .workerState.target.tag == $sha and .workerState.target.attestation.type == "version-tag" end)' \
            "$manifest" >/dev/null
          build_root="$(find "$RUNNER_TEMP/rollback-preflight" -type f -path '*/server/index.mjs' -print -quit)"
          test -n "$build_root"
          build_root="${build_root%/server/index.mjs}"
          test ! -e .output
          cp -R "$build_root" .output
          expected_count="$(jq -r '.build.fileCount' "$manifest")"
          expected_tree="$(jq -r '.build.treeSha256' "$manifest")"
          expected_server="$(jq -r '.build.serverEntrySha256' "$manifest")"
          actual_count="$(find .output -type f | wc -l | tr -d ' ')"
          actual_tree="$(cd .output && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          actual_server="$(sha256sum .output/server/index.mjs | awk '{print $1}')"
          test "$actual_count" = "$expected_count"
          test "$actual_tree" = "$expected_tree"
          test "$actual_server" = "$expected_server"
          cp "$RUNNER_TEMP/rollback-preflight/release-route-inventory.json" "$RUNNER_TEMP/rollback-route-inventory.json"
      - name: Install browser runtime for post-deploy proof
        run: npx playwright install --with-deps chromium
      - name: Place exact target at zero traffic and prove split
        id: split-target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          flag="$RUNNER_TEMP/rollback-traffic-mutation-attempted"
          split_status="$RUNNER_TEMP/rollback-target-split-deployment.json"
          current_status="$RUNNER_TEMP/rollback-current-before-mutation.json"
          npx wrangler deployments status --name "$WORKER_NAME" --json > "$current_status"
          EXPECTED="$EXPECTED_CURRENT_WORKER_VERSION_ID" STATUS_PATH="$current_status" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const value = JSON.parse(readFileSync(process.env.STATUS_PATH, 'utf8'))
          const deployment = value?.latest_deployment ?? value
          const versions = Array.isArray(deployment?.versions) ? deployment.versions : []
          const rows = versions.map((version) => ({ id: version?.version_id ?? version?.versionId ?? version?.id, traffic: Number(version?.percentage ?? version?.traffic ?? NaN) }))
          const active = rows.filter((row) => row.traffic > 0)
          const total = rows.reduce((sum, row) => sum + row.traffic, 0)
          if (!rows.length || rows.some((row) => typeof row.id !== 'string' || !Number.isFinite(row.traffic) || row.traffic < 0 || row.traffic > 100) || Math.abs(total - 100) > 0.001 || active.length !== 1 || active[0].id !== process.env.EXPECTED || active[0].traffic !== 100) throw new Error('Production current traffic is unknown or differs from the expected exact baseline')
          NODE
          # This durable marker is written immediately before the first traffic mutation.
          printf '%s\n' "true" > "$flag"
          npx wrangler versions deploy "$EXPECTED_CURRENT_WORKER_VERSION_ID@100" "$TARGET_WORKER_VERSION_ID@0" --name "$WORKER_NAME" --message "Incident rollback candidate proof: $INCIDENT_REASON" --yes
          npx wrangler deployments status --name "$WORKER_NAME" --json > "$split_status"
          EXPECTED_CURRENT="$EXPECTED_CURRENT_WORKER_VERSION_ID" EXPECTED_TARGET="$TARGET_WORKER_VERSION_ID" STATUS_PATH="$split_status" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const value = JSON.parse(readFileSync(process.env.STATUS_PATH, 'utf8'))
          const deployment = value?.latest_deployment ?? value
          const versions = Array.isArray(deployment?.versions) ? deployment.versions : []
          const rows = versions.map((version) => ({ id: version?.version_id ?? version?.versionId ?? version?.id, traffic: Number(version?.percentage ?? version?.traffic ?? NaN) }))
          const total = rows.reduce((sum, row) => sum + row.traffic, 0)
          const current = rows.find((row) => row.id === process.env.EXPECTED_CURRENT)
          const target = rows.find((row) => row.id === process.env.EXPECTED_TARGET)
          if (rows.length !== 2 || rows.some((row) => typeof row.id !== 'string' || !Number.isFinite(row.traffic) || row.traffic < 0 || row.traffic > 100) || Math.abs(total - 100) > 0.001 || !current || !target || current.traffic !== 100 || target.traffic !== 0) throw new Error('Rollback target split traffic is unknown or ambiguous')
          writeFileSync(process.env.RUNNER_TEMP + '/rollback-target-split-deployment-verified.json', `${JSON.stringify({ status: 'verified', current, target, versions: rows }, null, 2)}\n`)
          NODE
      - name: Wait for and strictly verify zero-traffic target with override
        id: verify-target-override
        run: |
          set -euo pipefail
          export WORKER_VERSION_OVERRIDE="$TARGET_WORKER_VERSION_ID"
          if [[ "$TARGET_SOURCE_SHA" == "$LEGACY_TARGET_SOURCE_SHA" && "$TARGET_WORKER_VERSION_ID" == "$LEGACY_TARGET_WORKER_VERSION_ID" ]]; then
            # This one reviewed target predates /api/deployment. Explicit empty
            # identity values suppress the waiter's GITHUB_SHA fallback while
            # retaining the version override for bounded asset readiness.
            DEPLOYMENT_EXPECTED_SOURCE_SHA="" \
            DEPLOYMENT_EXPECTED_WORKER_VERSION="" \
              node scripts/wait-for-deployed-assets.mjs
            LEGACY_PHASE="override" \
            LEGACY_DEPLOYMENT_PATH="$RUNNER_TEMP/rollback-target-split-deployment-verified.json" \
            LEGACY_OUTPUT_PATH="$RUNNER_TEMP/rollback-target-override-verification.json" \
              node --input-type=module <<'NODE'
            import { createHash } from 'node:crypto'
            import { readFileSync, writeFileSync } from 'node:fs'
            import { isAbsolute, relative, resolve } from 'node:path'

            const legacySha = process.env.LEGACY_TARGET_SOURCE_SHA
            const legacyVersionId = process.env.LEGACY_TARGET_WORKER_VERSION_ID
            if (process.env.TARGET_SOURCE_SHA !== legacySha || process.env.TARGET_WORKER_VERSION_ID !== legacyVersionId) throw new Error('Legacy rollback proof is restricted to the reviewed source SHA and Worker version ID')
            const inventory = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/rollback-route-inventory.json', 'utf8'))
            const manifest = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/rollback-preflight/production-rollback-preflight.json', 'utf8'))
            const deployment = JSON.parse(readFileSync(process.env.LEGACY_DEPLOYMENT_PATH, 'utf8'))
            if (inventory.inventoryKind !== 'legacy-rollback-reviewed' || inventory.targetSourceSha !== legacySha) throw new Error('Legacy rollback route inventory is not the exact reviewed inventory')
            if (manifest.workerState?.target?.versionId !== legacyVersionId || manifest.workerState?.target?.sourceSha !== legacySha || manifest.workerState?.target?.tag !== null || manifest.workerState?.target?.attestation?.type !== 'historical-actions-run-window-and-provider-created-on' || manifest.workerState?.target?.attestation?.runId !== 31142677520) throw new Error('Legacy target historical release-window attestation is missing')
            const targetTraffic = process.env.LEGACY_PHASE === 'override' ? deployment.target?.traffic : deployment.active?.traffic
            const targetId = process.env.LEGACY_PHASE === 'override' ? deployment.target?.id : deployment.active?.id
            if (targetId !== process.env.TARGET_WORKER_VERSION_ID || targetTraffic !== (process.env.LEGACY_PHASE === 'override' ? 0 : 100)) throw new Error('Legacy target is not in the proven deployment state')

            const sha256 = bytes => createHash('sha256').update(bytes).digest('hex')
            const overrideHeader = process.env.WORKER_VERSION_OVERRIDE
              ? { 'Cloudflare-Workers-Version-Overrides': `${process.env.WORKER_NAME}="${process.env.WORKER_VERSION_OVERRIDE}"` }
              : {}
            const fetchResponse = async (url, extraHeaders = {}) => {
              const controller = new AbortController()
              const timeout = setTimeout(() => controller.abort(), 15_000)
              try {
                return await fetch(url, { headers: { 'cache-control': 'no-cache', pragma: 'no-cache', ...overrideHeader, ...extraHeaders }, redirect: 'manual', signal: controller.signal })
              } finally {
                clearTimeout(timeout)
              }
            }
            const localBytes = pathname => {
              const root = resolve('.output/public')
              const path = resolve(root, `.${pathname}`)
              const escaped = relative(root, path)
              if (escaped.startsWith('..') || isAbsolute(escaped)) throw new Error(`Legacy asset path escapes build root: ${pathname}`)
              return readFileSync(path)
            }
            const verifiedAssets = new Map()
            const routeEvidence = []
            let routeCount = 0
            for (const surface of inventory.surfaces) {
              for (const route of surface.routes) {
                const requested = new URL(route.path, surface.baseUrl)
                let response = await fetchResponse(requested, surface.headers)
                if ([301, 302, 303, 307, 308].includes(response.status)) {
                  const location = new URL(response.headers.get('location') ?? '', requested)
                  const allowed = route.allowRedirects.some(entry => entry.status === response.status && entry.origin === location.origin && entry.path === location.pathname && !location.search && !location.hash)
                  if (!allowed) throw new Error(`Legacy route ${route.path} returned an unapproved redirect`)
                  response = await fetchResponse(location, surface.headers)
                }
                const expected = new URL(route.expectedPath, route.expectedOrigin)
                const actual = new URL(response.url)
                if (!response.ok || actual.origin !== expected.origin || actual.pathname !== expected.pathname || actual.search || actual.hash) throw new Error(`Legacy route ${route.path} did not resolve to its reviewed URL`)
                const html = await response.text()
                if (route.content && !html.includes(route.content)) throw new Error(`Legacy route ${route.path} omitted its reviewed identity copy`)
                const buildId = (html.match(/buildId\s*[:=]\s*["']([0-9a-f-]{36})["']/i) ?? html.match(/["']buildId["']\s*:\s*["']([0-9a-f-]{36})["']/i))?.[1]
                if (!buildId) throw new Error(`Legacy route ${route.path} did not expose a Nuxt build ID`)
                const assetPaths = [...new Set([...html.matchAll(/(?:src|href)=["'](\/_nuxt\/[^"'#\s]+)["']/gi)].map(match => match[1]))]
                if (assetPaths.length === 0) throw new Error(`Legacy route ${route.path} did not reference Nuxt assets`)
                for (const assetPath of [`/_nuxt/builds/meta/${buildId}.json`, ...assetPaths]) {
                  const pathname = new URL(assetPath, surface.baseUrl).pathname
                  const key = `${surface.baseUrl}\u0000${JSON.stringify(surface.headers)}\u0000${pathname}`
                  if (verifiedAssets.has(key)) continue
                  const assetResponse = await fetchResponse(new URL(pathname, surface.baseUrl), surface.headers)
                  if (!assetResponse.ok || [301, 302, 303, 307, 308].includes(assetResponse.status)) throw new Error(`Legacy asset ${pathname} was not served directly`)
                  const remote = Buffer.from(await assetResponse.arrayBuffer())
                  const local = localBytes(pathname)
                  if (sha256(remote) !== sha256(local)) throw new Error(`Legacy asset ${pathname} differs from the attested target build`)
                  verifiedAssets.set(key, pathname)
                }
                routeEvidence.push({ surface: surface.name, baseUrl: surface.baseUrl, headers: surface.headers, path: route.path, expectedOrigin: route.expectedOrigin, expectedPath: route.expectedPath, content: route.content, allowRedirects: route.allowRedirects, buildId, referencedAssets: [...new Set([`/_nuxt/builds/meta/${buildId}.json`, ...assetPaths].map(path => new URL(path, surface.baseUrl).pathname))] })
                routeCount += 1
              }
            }
            writeFileSync(process.env.LEGACY_OUTPUT_PATH, `${JSON.stringify({ ok: true, provenanceKind: 'legacy-release-window-and-exact-assets', phase: process.env.LEGACY_PHASE, sourceSha: legacySha, workerVersionId: legacyVersionId, routeCount, referencedAssetCount: verifiedAssets.size, routeInventory: 'legacy-rollback-reviewed', routes: routeEvidence }, null, 2)}\n`)
          NODE
          else
            DEPLOYMENT_EXPECTED_SOURCE_SHA="$TARGET_SOURCE_SHA" \
            DEPLOYMENT_EXPECTED_WORKER_VERSION="$TARGET_WORKER_VERSION_ID" \
              node scripts/wait-for-deployed-assets.mjs
            verifier="target-source/scripts/verify-deployed-candidate.mjs"
            test -f "$verifier"
            node "$verifier" \
              --base-url "$PRODUCTION_BASE_URL" \
              --expected-sha "$TARGET_SOURCE_SHA" \
              --expected-version-id "$TARGET_WORKER_VERSION_ID" \
              --worker-name "$WORKER_NAME" \
              --version-override "$TARGET_WORKER_VERSION_ID" \
              --route-inventory "$RUNNER_TEMP/rollback-route-inventory.json" \
              --build-dir .output/public \
              --output "$RUNNER_TEMP/rollback-target-override-verification.json"
          fi
