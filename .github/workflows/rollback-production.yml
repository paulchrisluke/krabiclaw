      - name: Verify deployed target assets and source provenance
        id: verify-target
        run: |
          set -euo pipefail
          if [[ "$TARGET_SOURCE_SHA" == "$LEGACY_TARGET_SOURCE_SHA" && "$TARGET_WORKER_VERSION_ID" == "$LEGACY_TARGET_WORKER_VERSION_ID" ]]; then
            LEGACY_CANDIDATE_PATH="$RUNNER_TEMP/rollback-target-override-verification.json" \
            LEGACY_DEPLOYMENT_PATH="$RUNNER_TEMP/rollback-target-deployment-verified.json" \
            LEGACY_OUTPUT_PATH="$RUNNER_TEMP/rollback-deployed-verification.json" \
              node --input-type=module <<'NODE'
            import { createHash } from 'node:crypto'
            import { readFileSync, writeFileSync } from 'node:fs'
            import { isAbsolute, relative, resolve } from 'node:path'

            const legacySha = process.env.LEGACY_TARGET_SOURCE_SHA
            const legacyVersionId = process.env.LEGACY_TARGET_WORKER_VERSION_ID
            if (process.env.TARGET_SOURCE_SHA !== legacySha || process.env.TARGET_WORKER_VERSION_ID !== legacyVersionId || process.env.WORKER_VERSION_OVERRIDE) throw new Error('Promoted legacy proof must use the reviewed target without a version override')
            const candidate = JSON.parse(readFileSync(process.env.LEGACY_CANDIDATE_PATH, 'utf8'))
            const deployment = JSON.parse(readFileSync(process.env.LEGACY_DEPLOYMENT_PATH, 'utf8'))
            if (candidate.provenanceKind !== 'legacy-release-window-and-exact-assets' || candidate.phase !== 'override' || candidate.sourceSha !== legacySha || candidate.workerVersionId !== legacyVersionId || !Array.isArray(candidate.routes) || candidate.routes.length === 0) throw new Error('Legacy zero-traffic proof is missing or malformed')
            if (deployment.active?.id !== legacyVersionId || deployment.active?.traffic !== 100) throw new Error('Legacy target is not proven at 100% traffic')

            const sha256 = bytes => createHash('sha256').update(bytes).digest('hex')
            const fetchResponse = async (url, extraHeaders = {}) => {
              const controller = new AbortController()
              const timeout = setTimeout(() => controller.abort(), 15_000)
              try {
                return await fetch(url, { headers: { 'cache-control': 'no-cache', pragma: 'no-cache', ...extraHeaders }, redirect: 'manual', signal: controller.signal })
              } finally {
                clearTimeout(timeout)
              }
            }
            const localBytes = pathname => {
              const root = resolve('.output/public')
              const path = resolve(root, `.${pathname}`)
              const escaped = relative(root, path)
              if (escaped.startsWith('..') || isAbsolute(escaped)) throw new Error(`Legacy asset path escapes build root: ${pathname}`)
              return readFileSync(path)
            }
            const verifiedAssets = new Set()
            for (const route of candidate.routes) {
              const requested = new URL(route.path, route.baseUrl)
              let response = await fetchResponse(requested, route.headers)
              if ([301, 302, 303, 307, 308].includes(response.status)) {
                const location = new URL(response.headers.get('location') ?? '', requested)
                const allowed = route.allowRedirects.some(entry => entry.status === response.status && entry.origin === location.origin && entry.path === location.pathname && !location.search && !location.hash)
                if (!allowed) throw new Error(`Promoted legacy route ${route.path} returned an unapproved redirect`)
                response = await fetchResponse(location, route.headers)
              }
              const actual = new URL(response.url)
              if (!response.ok || actual.origin !== route.expectedOrigin || actual.pathname !== route.expectedPath || actual.search || actual.hash) throw new Error(`Promoted legacy route ${route.path} did not resolve to its reviewed URL`)
              const html = await response.text()
              if (route.content && !html.includes(route.content)) throw new Error(`Promoted legacy route ${route.path} omitted its reviewed identity copy`)
              const buildId = (html.match(/buildId\s*[:=]\s*["']([0-9a-f-]{36})["']/i) ?? html.match(/["']buildId["']\s*:\s*["']([0-9a-f-]{36})["']/i))?.[1]
              if (buildId !== route.buildId) throw new Error(`Promoted legacy route ${route.path} changed Nuxt build ID after override proof`)
              const referencedAssets = [...new Set([`/_nuxt/builds/meta/${buildId}.json`, ...[...html.matchAll(/(?:src|href)=["'](\/_nuxt\/[^"'#\s]+)["']/gi)].map(match => new URL(match[1], route.baseUrl).pathname)])]
              if (JSON.stringify([...referencedAssets].sort()) !== JSON.stringify([...route.referencedAssets].sort())) throw new Error(`Promoted legacy route ${route.path} changed referenced assets after override proof`)
              for (const pathname of referencedAssets) {
                const key = `${route.baseUrl}\u0000${JSON.stringify(route.headers)}\u0000${pathname}`
                if (verifiedAssets.has(key)) continue
                const assetResponse = await fetchResponse(new URL(pathname, route.baseUrl), route.headers)
                if (!assetResponse.ok || [301, 302, 303, 307, 308].includes(assetResponse.status)) throw new Error(`Promoted legacy asset ${pathname} was not served directly`)
                const remote = Buffer.from(await assetResponse.arrayBuffer())
                if (sha256(remote) !== sha256(localBytes(pathname))) throw new Error(`Promoted legacy asset ${pathname} differs from the attested target build`)
                verifiedAssets.add(key)
              }
            }
            writeFileSync(process.env.LEGACY_OUTPUT_PATH, `${JSON.stringify({ ok: true, provenanceKind: 'legacy-release-window-and-exact-assets', phase: 'promoted-unoverridden', sourceSha: legacySha, workerVersionId: legacyVersionId, routeCount: candidate.routes.length, referencedAssetCount: verifiedAssets.size, routeInventory: 'legacy-rollback-reviewed' }, null, 2)}\n`)
          NODE
          else
            verifier="target-source/scripts/verify-deployed-candidate.mjs"
            test -f "$verifier"
            node "$verifier" \
              --base-url "$PRODUCTION_BASE_URL" \
              --expected-sha "$TARGET_SOURCE_SHA" \
              --expected-version-id "$TARGET_WORKER_VERSION_ID" \
              --worker-name "$WORKER_NAME" \
              --route-inventory "$RUNNER_TEMP/rollback-route-inventory.json" \
              --build-dir .output/public \
              --output "$RUNNER_TEMP/rollback-deployed-verification.json"
