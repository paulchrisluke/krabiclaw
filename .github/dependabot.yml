version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /workers/email-inbound
    schedule:
      interval: cron
      # Dependabot uses Fugit: every other Monday, rather than day-of-month steps.
      cronjob: "0 2 * * mon%2"
    cooldown:
      default-days: 30

    groups:
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
      typescript:
        patterns: ["typescript"]
      routine-dependencies:
        patterns: ["*"]
        exclude-patterns: ["better-auth", "@better-auth/*", "typescript"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      # Dependabot uses Fugit: every other Monday, rather than day-of-month steps.
      cronjob: "0 2 * * mon%2"
    cooldown:
      default-days: 30
    groups:
      github-actions:
        patterns: ["*"]
