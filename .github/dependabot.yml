version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /workers/email-inbound
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

    groups:
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
      compatible-dependencies:
        patterns: ["*"]
        exclude-patterns: ["better-auth", "@better-auth/*", "typescript", "nuxt", "nuxt-nightly", "h3", "drizzle-kit", "sharp", "satori"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
