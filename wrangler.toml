name = "krabiclaw"
main = ".output/server/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat_v2", "global_fetch_strictly_public"]

[placement]
mode = "smart"

[assets]
directory = ".output/public"

[dev]
host = "localhost:3000"
port = 3000
local_protocol = "http"
upstream_protocol = "http"

[triggers]
# Every expression is dispatched through Nitro's cloudflare:scheduled hook.
# Keep this list in sync with SCHEDULED_TASKS in server/scheduled-tasks.ts.
crons = ["*/5 * * * *", "*/2 * * * *", "*/10 * * * *", "0 3 * * *", "0 4 * * *", "0 0 * * SUN", "0 * * * *"]

[[routes]]
pattern = "*.krabiclaw.com/*"
zone_name = "krabiclaw.com"

[[routes]]
pattern = "krabiclaw.com/*"
zone_name = "krabiclaw.com"

[[routes]]
pattern = "*/*"
zone_name = "krabiclaw.com"



[vars]
CF_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
BETTER_AUTH_URL = "https://krabiclaw.com"
NUXT_PUBLIC_PLATFORM_DOMAIN = "https://krabiclaw.com"
NUXT_PUBLIC_FREE_SITE_DOMAIN = "https://krabiclaw.com"
NUXT_PUBLIC_APP_NAME = "KrabiClaw"
NUXT_PUBLIC_SITE_URL = "https://krabiclaw.com"
NUXT_PUBLIC_HELP_URL = "https://krabiclaw.com/help"
NUXT_PUBLIC_WHATSAPP_NUMBER = "16197200000"
MEDIA_BASE_URL = "https://media.krabiclaw.com"
AI_SEARCH_NAMESPACE = "default"
AI_SEARCH_INSTANCE_ID = "krabiclaw-platform-knowledge"
GA4_MEASUREMENT_ID = "G-NJ1BSP9BYG"
# Production is the only environment that should send real email/WhatsApp — made explicit
# here rather than relying on getEmailDeliveryMode/getWhatsAppDeliveryMode's default, since
# that default now fails closed (log_only) precisely so a missing var elsewhere never sends real messages.
EMAIL_DELIVERY_MODE = "provider"
WHATSAPP_DELIVERY_MODE = "provider"
DISCORD_DELIVERY_MODE = "provider"
# DISCORD_WEBHOOK_URL is a secret, never a plaintext var:
#   yarn wrangler secret put DISCORD_WEBHOOK_URL
# Internal cron/API endpoints use CRON_SECRET:
#   yarn wrangler secret put CRON_SECRET
# GA4_API_SECRET (Measurement Protocol) is a secret, not a var:
#   yarn wrangler secret put GA4_API_SECRET
# PREVIEW_SECRET signs scoped preview/draft tokens (server/utils/preview-token.ts)
# and is required by the onboarding draft endpoints. It must stay stable across
# deploys/runs in a given environment — rotating it invalidates any draft preview
# tokens currently in flight (including from another overlapping CI run). preview
# and staging CI deploys sync it from the fixed PREVIEW_SECRET_PREVIEW /
# PREVIEW_SECRET_STAGING repo secrets on every run (see .github/workflows/ci.yml);
# production is set once manually and not touched by CI:
#   yarn wrangler secret put PREVIEW_SECRET
# EMAIL_REPLY_SECRET signs reply+<type>-<id>-<token>@reply.<platform-domain> addresses
# (server/utils/submission-messages.ts) so a customer's inbound reply can be matched back to the
# right reservation/contact/experience-booking thread without a DB lookup by address alone.
# EMAIL_INBOUND_SECRET authenticates the separate krabiclaw-email-inbound Worker
# (workers/email-inbound/) calling POST /api/email/inbound. Both must stay stable across
# deploys — rotating them invalidates reply-to addresses already sent out in guest emails.
# staging syncs from the fixed EMAIL_REPLY_SECRET_STAGING / EMAIL_INBOUND_SECRET_STAGING repo
# secrets on every run (see .github/workflows/ci.yml); production is set once manually and not
# touched by CI:
#   yarn wrangler secret put EMAIL_REPLY_SECRET
#   yarn wrangler secret put EMAIL_INBOUND_SECRET
# PLATFORM_SEARCH_REINDEX_SECRET protects POST /api/internal/search/reindex and is required for
# yarn ai-search:sync. Production CI syncs it from the PLATFORM_SEARCH_REINDEX_SECRET repo
# secret and rebuilds the production index. Preview and staging deploys do not rebuild search
# automatically (see .github/workflows/ci.yml and docs/ai-search.md). To set it by hand:
#   yarn wrangler secret put PLATFORM_SEARCH_REINDEX_SECRET

[[d1_databases]]
binding = "DB"
database_name = "krabiclaw-db-epoch2"
database_id = "81f0e392-e7a1-4602-8ae9-7df87fc66868"
migrations_dir = "migrations"
remote = false

[[durable_objects.bindings]]
name = "GUEST_THREAD_COMMANDS"
class_name = "GuestThreadCommandObject"

[[durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"

[[migrations]]
tag = "v1_guest_inbox_infra"
new_sqlite_classes = ["GuestThreadCommandObject", "GuestInboxHubObject"]

[[queues.producers]]
binding = "GUEST_DELIVERY_QUEUE"
queue = "krabiclaw-guest-delivery"

[[queues.consumers]]
queue = "krabiclaw-guest-delivery"
dead_letter_queue = "krabiclaw-guest-delivery-dlq"
max_retries = 5

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "krabiclaw-media"
remote = false

[[kv_namespaces]]
binding = "SITE_CACHE"
id = "7fadf142e35745d6bec16b260eaab2f2"
remote = false

[ai]
binding = "AI"
remote = true

[[ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"
remote = true

[observability]
enabled = true

[observability.traces]
enabled = true

# Preview environment — CI deploys here on every PR; Playwright smoke tests run
# against preview.krabiclaw.com. Dedicated resources isolated from staging/prod.
#
# Dedicated preview resources (D1 replaced for epoch 3 on 2026-08-29):
#   krabiclaw-db-preview-epoch3  D1   d2f7a4a0-d6b8-493b-b484-8c0ead1ff83b
#   krabiclaw-media-preview      R2
#   krabiclaw-site-cache-preview KV   69252567b9cd4becbd486a337ab1e589
[env.preview]
workers_dev = true
preview_urls = true
routes = [
  { pattern = "preview.krabiclaw.com/*", zone_name = "krabiclaw.com" },
  { pattern = "*-preview.krabiclaw.com/*", zone_name = "krabiclaw.com" }
]

# Top-level [triggers] crons are inherited by named environments unless
# overridden here. Preview is a fixed shared CI database — scheduled tasks
# (domain-reconciliation, etc.) must never run
# against it; they drove a 93B-row D1 billing spike by scanning ever-growing,
# never-cleaned E2E data every 5-10 minutes.
[env.preview.triggers]
crons = []

[env.preview.vars]
CF_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
BETTER_AUTH_URL = "https://preview.krabiclaw.com"
NUXT_PUBLIC_PLATFORM_DOMAIN = "https://preview.krabiclaw.com"
MEDIA_BASE_URL = "https://preview.krabiclaw.com/__media"
NUXT_PUBLIC_FREE_SITE_DOMAIN = "https://krabiclaw.com"
NUXT_PUBLIC_APP_NAME = "KrabiClaw"
NUXT_PUBLIC_SITE_URL = "https://preview.krabiclaw.com"
NUXT_PUBLIC_HELP_URL = "https://preview.krabiclaw.com/help"
NUXT_PUBLIC_WHATSAPP_NUMBER = "16197200000"
AI_SEARCH_NAMESPACE = "default"
AI_SEARCH_INSTANCE_ID = "krabiclaw-platform-knowledge-preview"
# Analytics is intentionally disabled outside production.
GA4_MEASUREMENT_ID = ""
EMAIL_DELIVERY_MODE = "log_only"
WHATSAPP_DELIVERY_MODE = "log_only"
DISCORD_DELIVERY_MODE = "log_only"
E2E_ALLOW_DEV_ROUTES = "true"
# E2E_DEV_ROUTE_SECRET is pushed via `wrangler secret put` in ci.yml, not a plaintext var here.

[[env.preview.d1_databases]]
binding = "DB"
database_name = "krabiclaw-db-preview-epoch3"
database_id = "d2f7a4a0-d6b8-493b-b484-8c0ead1ff83b"
migrations_dir = "migrations"
remote = false

[[env.preview.durable_objects.bindings]]
name = "GUEST_THREAD_COMMANDS"
class_name = "GuestThreadCommandObject"

[[env.preview.durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"

[[env.preview.migrations]]
tag = "v1_guest_inbox_infra"
new_sqlite_classes = ["GuestThreadCommandObject", "GuestInboxHubObject"]

[[env.preview.queues.producers]]
binding = "GUEST_DELIVERY_QUEUE"
queue = "krabiclaw-guest-delivery-preview"

[[env.preview.queues.consumers]]
queue = "krabiclaw-guest-delivery-preview"
dead_letter_queue = "krabiclaw-guest-delivery-preview-dlq"
max_retries = 5

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "krabiclaw-media-preview"
remote = false

[[env.preview.kv_namespaces]]
binding = "SITE_CACHE"
id = "69252567b9cd4becbd486a337ab1e589"
remote = false

[env.preview.ai]
binding = "AI"
remote = true

[[env.preview.ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"
remote = true

[env.preview.observability]
enabled = false

# Stable staging environment — uses dedicated non-production data/resources.
# Tenant aliases stay at the first subdomain level (for example,
# pottery-house-staging.krabiclaw.com), which is covered by the zone certificate.
# The more-specific environment route wins over production's broad wildcard.
[env.staging]
routes = [
  { pattern = "staging.krabiclaw.com/*", zone_name = "krabiclaw.com" },
  { pattern = "*-staging.krabiclaw.com/*", zone_name = "krabiclaw.com" }
]

# See env.preview.triggers above — same rationale, same fix.
[env.staging.triggers]
crons = []

[env.staging.vars]
CF_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
BETTER_AUTH_URL = "https://staging.krabiclaw.com"
NUXT_PUBLIC_PLATFORM_DOMAIN = "https://staging.krabiclaw.com"
MEDIA_BASE_URL = "https://staging.krabiclaw.com/__media"
NUXT_PUBLIC_FREE_SITE_DOMAIN = "https://krabiclaw.com"
NUXT_PUBLIC_APP_NAME = "KrabiClaw Staging"
NUXT_PUBLIC_SITE_URL = "https://staging.krabiclaw.com"
NUXT_PUBLIC_HELP_URL = "https://staging.krabiclaw.com/help"
NUXT_PUBLIC_WHATSAPP_NUMBER = "16197200000"
AI_SEARCH_NAMESPACE = "default"
AI_SEARCH_INSTANCE_ID = "krabiclaw-platform-knowledge-staging"
# Analytics is intentionally disabled outside production.
GA4_MEASUREMENT_ID = ""
EMAIL_DELIVERY_MODE = "log_only"
WHATSAPP_DELIVERY_MODE = "log_only"
DISCORD_DELIVERY_MODE = "log_only"
E2E_ALLOW_DEV_ROUTES = "true"
# E2E_DEV_ROUTE_SECRET is pushed via `wrangler secret put` in ci.yml, not a plaintext var here.

[[env.staging.d1_databases]]
binding = "DB"
database_name = "krabiclaw-db-staging-epoch3"
database_id = "61af16e5-0873-49b9-90ce-aea2ff1991e4"
migrations_dir = "migrations"
remote = false

[[env.staging.durable_objects.bindings]]
name = "GUEST_THREAD_COMMANDS"
class_name = "GuestThreadCommandObject"

[[env.staging.durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"

[[env.staging.migrations]]
tag = "v1_guest_inbox_infra"
new_sqlite_classes = ["GuestThreadCommandObject", "GuestInboxHubObject"]

[[env.staging.queues.producers]]
binding = "GUEST_DELIVERY_QUEUE"
queue = "krabiclaw-guest-delivery-staging"

[[env.staging.queues.consumers]]
queue = "krabiclaw-guest-delivery-staging"
dead_letter_queue = "krabiclaw-guest-delivery-staging-dlq"
max_retries = 5

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "krabiclaw-media-staging"
remote = false

[[env.staging.kv_namespaces]]
binding = "SITE_CACHE"
id = "9e829557fd2b46dba4148f2ed27a5c0b"
remote = false

[env.staging.ai]
binding = "AI"
remote = true

[[env.staging.ai_search_namespaces]]
