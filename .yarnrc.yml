nodeLinker: node-modules
npmRegistryServer: "https://registry.npmjs.org"
npmMinimalAgeGate: "30d"
npmPreapprovedPackages:
  - postal-mime
  # Wrangler 4.129.1 fixes transient dev proxy failures (workers-sdk PR #15252).
  - "wrangler@4.129.1"
  - "@cloudflare/workers-types@5.20260907.1"
  - "miniflare@5.20260907.0-alpha"
  - "workerd@1.20260907.1"
  - "@cloudflare/workerd-linux-64@1.20260907.1"
  - "@cloudflare/workerd-linux-arm64@1.20260907.1"
  - "@cloudflare/workerd-darwin-64@1.20260907.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260907.1"
  - "@cloudflare/workerd-windows-64@1.20260907.1"
  # Better Auth 1.7.4 (published 2026-09-10) carries the CIMD fix that lets
  # Claude connect: @better-auth/cimd dropped the invented `grant_types must be
  # a subset of ["authorization_code", "refresh_token"]` check that rejected
  # Claude's client metadata document over `jwt-bearer`. Preapproved past the
  # 30d age gate deliberately; the five packages version in lockstep.
  - better-auth
  - "@better-auth/core"
  - "@better-auth/cimd"
  - "@better-auth/oauth-provider"
  - "@better-auth/stripe"
  - "@better-auth/drizzle-adapter"
  - "@better-auth/kysely-adapter"
  - "@better-auth/memory-adapter"
  - "@better-auth/mongo-adapter"
  - "@better-auth/prisma-adapter"
  - "@better-auth/telemetry"
  - "@better-auth/utils"
  - zod
enableScripts: false
checksumBehavior: throw
