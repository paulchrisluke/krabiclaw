nodeLinker: node-modules
npmRegistryServer: "https://registry.npmjs.org"
npmMinimalAgeGate: "30d"
npmPreapprovedPackages:
  - postal-mime
  # Wrangler 4.143.1 is the first release whose exact-pinned miniflare
  # (5.20260926.1-alpha) ships undici 7.29.1 and sharp 0.35.4, fixing
  # GHSA-vp8m-p9jh-q5pm, GHSA-w293-vg96-wgc3 and GHSA-rgj7-g3m4-5g8c. Its
  # workerd, platform binaries, unenv preset and workers-types peer move with it.
  - "wrangler@4.143.1"
  - "@cloudflare/workers-types@5.20260926.1"
  - "@cloudflare/unenv-preset@2.16.2"
  - "miniflare@5.20260926.1-alpha"
  - "workerd@1.20260926.1"
  - "@cloudflare/workerd-linux-64@1.20260926.1"
  - "@cloudflare/workerd-linux-arm64@1.20260926.1"
  - "@cloudflare/workerd-darwin-64@1.20260926.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260926.1"
  - "@cloudflare/workerd-windows-64@1.20260926.1"
  # brace-expansion 2.1.7 and 5.0.12 fix GHSA-6j4f-fj2g-mc7p and
  # GHSA-qhr7-859c-m2p7 (stack exhaustion), reached through minimatch 9 and 10.
  - "brace-expansion@2.1.7"
  - "brace-expansion@5.0.12"
  # devalue 5.9.4 fixes GHSA-j22f-vq7h-c4qm, GHSA-mcm9-63f2-9j32 and
  # GHSA-x5rw-q4pp-hg5g within nuxt-nightly's ^5.9.0 range.
  - "devalue@5.9.4"
  # Better Auth 1.7.5 preserves the Claude CIMD grant-types fix and allows
  # consecutive OAuth requests with valid uncached client metadata. Its five
  # packages version in lockstep; fetch 1.3.2 is their exact shared dependency.
  - better-auth
  - "@better-auth/core"
  - "@better-auth/cimd"
  - "@better-auth/oauth-provider"
  - "@better-auth/stripe"
  - "@better-auth/drizzle-adapter"
  - "@better-auth/kysely-adapter"
  - "@better-auth/memory-adapter"
  - "@better-auth/mongo-adapter"
  - "@better-auth/prisma-adapter"
  - "@better-auth/telemetry"
  - "@better-auth/utils"
  - "@better-fetch/fetch@1.3.2"
  - zod
enableScripts: false
checksumBehavior: throw
